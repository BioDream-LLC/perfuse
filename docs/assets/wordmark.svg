<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 130" width="560" height="130" role="img" aria-label="Perfuse">
  <title>Perfuse</title>

  <defs>
    <!-- The letter fill: lighter at the top so the word reads as lit from above. -->
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="34%" stop-color="#22d3ee"/>
      <stop offset="72%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>

    <!-- The glare: a bright band across the upper third of the letterforms, fading to nothing before the baseline. -->
    <linearGradient id="gleam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.72"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="47%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- A diagonal sweep, the highlight a polished surface catches. -->
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="52%" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="lift" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.2" flood-color="#0b1220" flood-opacity="0.30"/>
    </filter>

    <!-- The word is declared once and referenced, so the fill, the glare and the sweep cannot drift apart. -->
    <text id="word" x="280" y="92" text-anchor="middle" font-size="86" font-weight="800"
          letter-spacing="-0.02em"
          font-family="Avenir Next, Avenir, Segoe UI, system-ui, -apple-system, Helvetica Neue, Arial, sans-serif">Perfuse</text>

    <!-- Clipped to the letters, so the highlights stay inside them. -->
    <clipPath id="letters"><use href="#word"/></clipPath>
  </defs>

  <!-- The letters themselves. -->
  <use href="#word" fill="url(#ink)" filter="url(#lift)"/>

  <!-- Highlights, confined to the letterforms. -->
  <g clip-path="url(#letters)">
    <rect x="0" y="0" width="560" height="130" fill="url(#gleam)"/>
    <rect x="-140" y="0" width="260" height="130" fill="url(#sweep)" transform="skewX(-20)"/>
  </g>

  <!-- A pulse trailing off the final letter: the one mark that says what this software is for. -->
  <path d="M470 62 h9 l6 -22 l8 44 l7 -22 h28" fill="none" stroke="#22d3ee" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>

  <text x="280" y="120" text-anchor="middle" font-size="15" fill="#64748b" letter-spacing="0.26em"
        font-family="system-ui, -apple-system, Segoe UI, sans-serif">HEALTHCARE INTEGRATION ENGINE</text>
</svg>
