<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Two organisations, each connected to a QHIN, exchange records across the national network. Perfuse registers with UDAP, verifies signed metadata and certificate chains, and audits every exchange to disk.">
  <title>TEFCA exchange with UDAP</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="flowLine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/><stop offset="100%" stop-color="#6366f1" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.45"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/>
    </marker>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="480" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="480" rx="18" fill="url(#grid)" opacity="0.55"/>
  <text x="64" y="64" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f1f5f9" text-anchor="start" opacity="1">Exchanging records with organisations you have never connected to</text>
  <rect x="64" y="170" width="230" height="170" rx="14" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5" filter="url(#lift)"/>
  <text x="88" y="214" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#f1f5f9" text-anchor="start" opacity="1">Your organisation</text>
  <text x="88" y="244" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#22d3ee" text-anchor="start" opacity="1">with Perfuse</text>
  <text x="88" y="280.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="start" opacity="1">UDAP registration</text>
  <text x="88" y="301.75" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="start" opacity="1">audit log on disk</text>
  <circle cx="445" cy="255" r="62" fill="url(#hero)" stroke="none" stroke-width="0" filter="url(#lift)"/>
  <text x="445" y="262" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="middle" opacity="1">QHIN A</text>
  <circle cx="755" cy="255" r="62" fill="url(#hero)" stroke="none" stroke-width="0" filter="url(#lift)"/>
  <text x="755" y="262" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="middle" opacity="1">QHIN B</text>
  <path d="M507 255 H 693" stroke="url(#flowLine)" stroke-width="6" stroke-linecap="round"/>
  <text x="600" y="236" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="middle" opacity="1">TEFCA network</text>
  <rect x="906" y="170" width="230" height="170" rx="14" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" filter="url(#lift)"/>
  <text x="930" y="214" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#f1f5f9" text-anchor="start" opacity="1">Another organisation</text>
  <text x="930" y="244" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#6366f1" text-anchor="start" opacity="1">anywhere in the US</text>
  <text x="930" y="280.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="start" opacity="1">hospital, clinic,</text>
  <text x="930" y="301.75" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="start" opacity="1">payer or agency</text>
  <line x1="298" y1="255" x2="380" y2="255" stroke="#22d3ee" stroke-width="3.5" stroke-linecap="round" marker-end="url(#tip)"/>
  <line x1="820" y1="255" x2="900" y2="255" stroke="#6366f1" stroke-width="3.5" stroke-linecap="round" marker-end="url(#tip)"/>
  <rect x="140" y="400" width="247" height="29" rx="14.5" fill="#2dd4bf" fill-opacity="0.16" stroke="#2dd4bf" stroke-opacity="0.6"/>
  <text x="263.6" y="418" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#2dd4bf" text-anchor="middle" opacity="1">signed metadata verified</text>
  <rect x="470" y="400" width="266" height="29" rx="14.5" fill="#2dd4bf" fill-opacity="0.16" stroke="#2dd4bf" stroke-opacity="0.6"/>
  <text x="602.9" y="418" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#2dd4bf" text-anchor="middle" opacity="1">certificate chains checked</text>
  <rect x="800" y="400" width="229" height="29" rx="14.5" fill="#2dd4bf" fill-opacity="0.16" stroke="#2dd4bf" stroke-opacity="0.6"/>
  <text x="914.3" y="418" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#2dd4bf" text-anchor="middle" opacity="1">every exchange audited</text>
</svg>
