<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Flow: an EHR or lab feed reaches Perfuse. Messages carrying a reportable-condition trigger code become an eICR sent to public health, and a Reportability Response comes back. Lab results become HL7 2.5.1 ELR messages carrying only the reportable orders.">
  <title>Electronic case reporting and lab reporting</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="flowLine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/><stop offset="100%" stop-color="#6366f1" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.45"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/>
    </marker>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="470" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="470" rx="18" fill="url(#grid)" opacity="0.55"/>
  <text x="64" y="64" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f1f5f9" text-anchor="start" opacity="1">From clinical data to public health, automatically</text>
  <rect x="64" y="150" width="220" height="200" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#lift)"/>
  <text x="88" y="194" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#f1f5f9" text-anchor="start" opacity="1">EHR and labs</text>
  <text x="88" y="230.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#94a3b8" text-anchor="start" opacity="1">ADT, ORU, notes</text>
  <text x="88" y="252.475" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#94a3b8" text-anchor="start" opacity="1">HL7 v2 or FHIR</text>
  <rect x="400" y="130" width="300" height="240" rx="14" fill="url(#hero)" stroke="none" stroke-width="1.5" filter="url(#lift)"/>
  <text x="550" y="178" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#fff" text-anchor="middle" opacity="1">Perfuse</text>
  <text x="424" y="220" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#e0f2fe" text-anchor="start" opacity="1">matches trigger codes (RCTC)</text>
  <text x="424" y="250" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#e0f2fe" text-anchor="start" opacity="1">builds the eICR</text>
  <text x="424" y="280" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#e0f2fe" text-anchor="start" opacity="1">reshapes lab results to ELR</text>
  <text x="424" y="310" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#e0f2fe" text-anchor="start" opacity="1">stores the response</text>
  <line x1="290" y1="250" x2="392" y2="250" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" marker-end="url(#tip)"/>
  <rect x="820" y="110" width="316" height="110" rx="14" fill="#1e293b" stroke="#2dd4bf" stroke-width="1.5" filter="url(#lift)"/>
  <text x="844" y="150" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#f1f5f9" text-anchor="start" opacity="1">Public health: case reports</text>
  <text x="844" y="180" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#2dd4bf" text-anchor="start" opacity="1">eCR 2.1.2 eICR out</text>
  <text x="844" y="204" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#94a3b8" text-anchor="start" opacity="1">Reportability Response back</text>
  <rect x="820" y="270" width="316" height="110" rx="14" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" filter="url(#lift)"/>
  <text x="844" y="310" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#f1f5f9" text-anchor="start" opacity="1">Public health: lab reporting</text>
  <text x="844" y="340" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#fbbf24" text-anchor="start" opacity="1">HL7 2.5.1 ELR</text>
  <text x="844" y="364" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#94a3b8" text-anchor="start" opacity="1">reportable orders only</text>
  <line x1="706" y1="200" x2="812" y2="165" stroke="#2dd4bf" stroke-width="3.5" stroke-linecap="round" marker-end="url(#tip)"/>
  <line x1="812" y1="190" x2="706" y2="225" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round" marker-end="url(#tip)" stroke-dasharray="7 6"/>
  <line x1="706" y1="300" x2="812" y2="325" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round" marker-end="url(#tip)"/>
  <rect x="64" y="410" width="614" height="28" rx="14.0" fill="#22d3ee" fill-opacity="0.16" stroke="#22d3ee" stroke-opacity="0.6"/>
  <text x="371.12" y="427" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#22d3ee" text-anchor="middle" opacity="1">a report goes because a code matched, not because someone remembered</text>
</svg>
