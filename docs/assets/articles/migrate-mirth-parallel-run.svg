<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="A parallel run that proves the switch is safe. A sender sends a copy of each live message to both Mirth, which keeps delivering to the receiving systems, and Perfuse, whose only destination is a folder so it can reach nobody. The two folders of output are then compared by perfuse compare, which pairs messages by their control ID and groups differences by cause.">
  <title>Running Perfuse beside Mirth, delivering nothing, and comparing</title>
  <rect width="1200" height="560" rx="16" fill="#f5f8fc"/>
  <text x="600" y="50" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700" fill="#0b1f3a" text-anchor="middle">Prove it on real traffic before you switch</text>

  <!-- sender -->
  <rect x="40" y="230" width="150" height="80" rx="11" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="115" y="266" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#0b1f3a" text-anchor="middle">The sender</text>
  <text x="115" y="290" font-family="system-ui, sans-serif" font-size="15" fill="#475569" text-anchor="middle">lab, ADT, orders</text>

  <!-- split arrows -->
  <defs>
    <marker id="mc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <marker id="mc-stop" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <circle cx="6" cy="6" r="5" fill="none" stroke="#dc2626" stroke-width="2"/>
      <path d="M2.8 2.8 L9.2 9.2" stroke="#dc2626" stroke-width="2"/>
    </marker>
  </defs>
  <path d="M190 258 H250 V150 H300" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#mc-arrow)"/>
  <path d="M190 282 H250 V400 H300" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#mc-arrow)"/>
  <text x="250" y="130" font-family="system-ui, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">a copy</text>
  <text x="250" y="438" font-family="system-ui, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">the same copy</text>

  <!-- Mirth path (live) -->
  <rect x="300" y="110" width="200" height="80" rx="11" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <text x="400" y="146" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#0b1f3a" text-anchor="middle">Mirth (live)</text>
  <text x="400" y="170" font-family="system-ui, sans-serif" font-size="15" fill="#059669" text-anchor="middle">keeps delivering</text>

  <rect x="600" y="110" width="200" height="80" rx="11" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="700" y="140" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#0b1f3a" text-anchor="middle">Receiving systems</text>
  <text x="700" y="164" font-family="system-ui, sans-serif" font-size="15" fill="#475569" text-anchor="middle">EHR, downstream, archive</text>
  <path d="M500 150 H600" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#mc-arrow)"/>

  <!-- Perfuse path (shadow) -->
  <rect x="300" y="360" width="200" height="80" rx="11" fill="#e0f2f7" stroke="#0e7490" stroke-width="2"/>
  <text x="400" y="396" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#0b1f3a" text-anchor="middle">Perfuse (trial)</text>
  <text x="400" y="420" font-family="system-ui, sans-serif" font-size="15" fill="#0e7490" text-anchor="middle">only destination: a folder</text>

  <rect x="600" y="360" width="200" height="80" rx="11" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="700" y="396" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#0b1f3a" text-anchor="middle">Receiving systems</text>
  <text x="700" y="420" font-family="system-ui, sans-serif" font-size="15" fill="#dc2626" text-anchor="middle">cannot be reached</text>
  <path d="M500 400 H600" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#mc-stop)"/>

  <!-- compare -->
  <rect x="900" y="235" width="260" height="200" rx="12" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
  <text x="1030" y="272" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0b1f3a" text-anchor="middle">perfuse compare</text>
  <text x="1030" y="304" font-family="system-ui, sans-serif" font-size="15" fill="#475569" text-anchor="middle">pairs messages by</text>
  <text x="1030" y="326" font-family="system-ui, sans-serif" font-size="15" fill="#475569" text-anchor="middle">control ID (MSH-10)</text>
  <text x="1030" y="356" font-family="system-ui, sans-serif" font-size="15" fill="#475569" text-anchor="middle">and groups every</text>
  <text x="1030" y="378" font-family="system-ui, sans-serif" font-size="15" fill="#475569" text-anchor="middle">difference by cause,</text>
  <text x="1030" y="400" font-family="system-ui, sans-serif" font-size="15" fill="#475569" text-anchor="middle">so one reason reads</text>
  <text x="1030" y="422" font-family="system-ui, sans-serif" font-size="15" fill="#475569" text-anchor="middle">as one finding.</text>

  <path d="M800 150 H850 V300 H898" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#mc-arrow)"/>
  <path d="M800 400 H850 V360 H898" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#mc-arrow)"/>
  <text x="862" y="250" font-family="system-ui, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Mirth's output</text>
  <text x="866" y="500" font-family="system-ui, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Perfuse's output</text>

  <text x="600" y="540" font-family="system-ui, sans-serif" font-size="16" fill="#475569" text-anchor="middle">Nobody has to approve a trial that delivers to no one. The report carries counts, not patient data, so it is safe to paste into a ticket.</text>
</svg>
