<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Banner: a contract with field checks, one flagged as a violation.">
  <title>Catch upstream changes the same day</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="flowLine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/><stop offset="100%" stop-color="#6366f1" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.45"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/>
    </marker>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)" opacity="0.55"/>
  <circle cx="930" cy="180" r="260" fill="url(#halo)" stroke="none" stroke-width="0" />
  <rect x="64" y="64" width="154" height="29" rx="14.5" fill="#22d3ee" fill-opacity="0.16" stroke="#22d3ee" stroke-opacity="0.6"/>
  <text x="141.1" y="82" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#22d3ee" text-anchor="middle" opacity="1">FEED CONTRACTS</text>
  <text x="64" y="150" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="700" fill="#f1f5f9" text-anchor="start" opacity="1">Catch upstream</text>
  <text x="64" y="206" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="700" fill="#f1f5f9" text-anchor="start" opacity="1">changes the same day</text>
  <rect x="64" y="242" width="120" height="6" rx="3" fill="url(#flow)"/>
  <text x="64" y="320" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#94a3b8" text-anchor="start" opacity="1">perfuse.health</text>
  <rect x="820" y="46" width="220" height="270" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#lift)"/>
  <text x="846" y="96" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#f1f5f9" text-anchor="start" opacity="1">PID-3</text>
  <circle cx="1008" cy="90" r="11" fill="#2dd4bf" stroke="none" stroke-width="0" />
  <path d="M1003 90 l4 4 l8 -9" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="846" y="140" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#f1f5f9" text-anchor="start" opacity="1">PID-8</text>
  <circle cx="1008" cy="134" r="11" fill="#2dd4bf" stroke="none" stroke-width="0" />
  <path d="M1003 134 l4 4 l8 -9" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="846" y="184" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#f1f5f9" text-anchor="start" opacity="1">PV1-2</text>
  <circle cx="1008" cy="178" r="11" fill="#2dd4bf" stroke="none" stroke-width="0" />
  <path d="M1003 178 l4 4 l8 -9" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="846" y="228" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#f1f5f9" text-anchor="start" opacity="1">OBX-6</text>
  <circle cx="1008" cy="222" r="11" fill="#fb7185" stroke="none" stroke-width="0" />
  <path d="M1004 218 l8 8 M1012 218 l-8 8" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
  <text x="846" y="272" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#f1f5f9" text-anchor="start" opacity="1">ZPI</text>
  <circle cx="1008" cy="266" r="11" fill="#2dd4bf" stroke="none" stroke-width="0" />
  <path d="M1003 266 l4 4 l8 -9" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <rect x="600" y="318" width="241" height="28" rx="14.0" fill="#fb7185" fill-opacity="0.16" stroke="#fb7185" stroke-opacity="0.6"/>
  <text x="720.5" y="335" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#fb7185" text-anchor="middle" opacity="1">contract violation: OBX-6</text>
</svg>
