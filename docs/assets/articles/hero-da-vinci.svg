<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Banner: CRD, DTR and PAS as three linked circles, from order to documentation to decision.">
  <title>CRD, DTR and PAS, order to decision</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="flowLine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/><stop offset="100%" stop-color="#6366f1" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.45"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/>
    </marker>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)" opacity="0.55"/>
  <circle cx="930" cy="180" r="260" fill="url(#halo)" stroke="none" stroke-width="0" />
  <rect x="64" y="64" width="98" height="29" rx="14.5" fill="#22d3ee" fill-opacity="0.16" stroke="#22d3ee" stroke-opacity="0.6"/>
  <text x="113.2" y="82" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#22d3ee" text-anchor="middle" opacity="1">DA VINCI</text>
  <text x="64" y="150" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="700" fill="#f1f5f9" text-anchor="start" opacity="1">CRD, DTR and PAS,</text>
  <text x="64" y="206" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="700" fill="#f1f5f9" text-anchor="start" opacity="1">order to decision</text>
  <rect x="64" y="242" width="120" height="6" rx="3" fill="url(#flow)"/>
  <text x="64" y="320" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#94a3b8" text-anchor="start" opacity="1">perfuse.health</text>
  <circle cx="760" cy="180" r="62" fill="#1e293b" stroke="#22d3ee" stroke-width="4" filter="url(#lift)"/>
  <text x="760" y="190" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#22d3ee" text-anchor="middle" opacity="1">CRD</text>
  <line x1="826" y1="180" x2="860" y2="180" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" marker-end="url(#tip)"/>
  <circle cx="930" cy="180" r="62" fill="#1e293b" stroke="#3b82f6" stroke-width="4" filter="url(#lift)"/>
  <text x="930" y="190" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#3b82f6" text-anchor="middle" opacity="1">DTR</text>
  <line x1="996" y1="180" x2="1030" y2="180" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" marker-end="url(#tip)"/>
  <circle cx="1100" cy="180" r="62" fill="#1e293b" stroke="#6366f1" stroke-width="4" filter="url(#lift)"/>
  <text x="1100" y="190" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#6366f1" text-anchor="middle" opacity="1">PAS</text>
  <text x="930" y="290" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" fill="#94a3b8" text-anchor="middle" opacity="1">order  →  documentation  →  decision</text>
</svg>
