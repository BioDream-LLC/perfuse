<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Flow: each message reaches the live channel, which delivers it and acknowledges it. A copy runs through the candidate channel, which has no destinations and cannot deliver. The two outputs are compared field by field at component level, and the Shadow tab shows the difference rate and each disagreement.">
  <title>Shadow mode</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="flowLine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/><stop offset="100%" stop-color="#6366f1" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.45"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/>
    </marker>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="480" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="480" rx="18" fill="url(#grid)" opacity="0.55"/>
  <text x="64" y="64" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f1f5f9" text-anchor="start" opacity="1">Test a change on real traffic, with nothing delivered</text>
  <rect x="64" y="200" width="190" height="100" rx="14" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5" filter="url(#lift)"/>
  <text x="88" y="244" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#f1f5f9" text-anchor="start" opacity="1">Message</text>
  <text x="88" y="272" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#94a3b8" text-anchor="start" opacity="1">real traffic</text>
  <rect x="360" y="110" width="300" height="110" rx="14" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5" filter="url(#lift)"/>
  <text x="384" y="152" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#22d3ee" text-anchor="start" opacity="1">Live channel</text>
  <text x="384" y="182" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#94a3b8" text-anchor="start" opacity="1">delivers and acknowledges</text>
  <rect x="360" y="290" width="300" height="110" rx="14" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" filter="url(#lift)" stroke-dasharray="8 6"/>
  <text x="384" y="332" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#6366f1" text-anchor="start" opacity="1">Candidate channel</text>
  <text x="384" y="362" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#94a3b8" text-anchor="start" opacity="1">no destinations at all</text>
  <line x1="258" y1="240" x2="352" y2="170" stroke="#22d3ee" stroke-width="3.5" stroke-linecap="round" marker-end="url(#tip)"/>
  <line x1="258" y1="262" x2="352" y2="340" stroke="#6366f1" stroke-width="3" stroke-linecap="round" marker-end="url(#tip)" stroke-dasharray="8 6"/>
  <rect x="780" y="110" width="180" height="110" rx="14" fill="#273449" stroke="#22d3ee" stroke-width="1.5" />
  <text x="870" y="160" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#f1f5f9" text-anchor="middle" opacity="1">Receiver</text>
  <text x="870" y="188" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#94a3b8" text-anchor="middle" opacity="1">gets the live result</text>
  <line x1="666" y1="165" x2="772" y2="165" stroke="#22d3ee" stroke-width="3.5" stroke-linecap="round" marker-end="url(#tip)"/>
  <rect x="780" y="270" width="356" height="150" rx="14" fill="url(#hero)" stroke="none" stroke-width="1.5" filter="url(#lift)"/>
  <text x="804" y="312" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" fill="#fff" text-anchor="start" opacity="1">Compared field by field</text>
  <text x="804" y="344" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#e0f2fe" text-anchor="start" opacity="1">PID-5.1  SMITH  →  Smith</text>
  <text x="804" y="370" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#e0f2fe" text-anchor="start" opacity="1">filter: kept  vs  dropped</text>
  <text x="804" y="396" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#e0f2fe" text-anchor="start" opacity="1">difference rate on the Shadow tab</text>
  <path d="M666 345 H 772" stroke="#6366f1" stroke-width="3" marker-end="url(#tip)"/>
  <path d="M620 222 C 620 250, 700 290, 772 300" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="4 6" marker-end="url(#tip)"/>
</svg>
