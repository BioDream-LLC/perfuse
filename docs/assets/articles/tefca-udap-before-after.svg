<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Before TEFCA, every organisation had to make a separate connection and contract with every other, shown as a tangle of lines between six organisations. After TEFCA, each organisation connects once to a shared hub, so it can reach all the others through that single connection.">
  <title>Before and after TEFCA: many connections versus one</title>
  <rect width="1200" height="560" rx="18" fill="#f5f8fc"/>
  <text x="60" y="52" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="26" font-weight="700" fill="#0b1f3a">Join once, reach everyone</text>

  <!-- BEFORE -->
  <text x="300" y="100" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="19" font-weight="700" fill="#b91c1c" text-anchor="middle">Before: a connection to every partner</text>

  <!-- tangle lines -->
  <g stroke="#f87171" stroke-width="1.5">
    <line x1="300" y1="160" x2="160" y2="280"/>
    <line x1="300" y1="160" x2="440" y2="280"/>
    <line x1="300" y1="160" x2="220" y2="420"/>
    <line x1="300" y1="160" x2="380" y2="420"/>
    <line x1="160" y1="280" x2="440" y2="280"/>
    <line x1="160" y1="280" x2="220" y2="420"/>
    <line x1="160" y1="280" x2="380" y2="420"/>
    <line x1="440" y1="280" x2="220" y2="420"/>
    <line x1="440" y1="280" x2="380" y2="420"/>
    <line x1="220" y1="420" x2="380" y2="420"/>
  </g>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#0b1f3a" text-anchor="middle">
    <circle cx="300" cy="160" r="34" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/><text x="300" y="165">Hospital</text>
    <circle cx="160" cy="280" r="34" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/><text x="160" y="285">Clinic</text>
    <circle cx="440" cy="280" r="34" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/><text x="440" y="285">Lab</text>
    <circle cx="220" cy="420" r="34" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/><text x="220" y="425">Payer</text>
    <circle cx="380" cy="420" r="34" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/><text x="380" y="425">Public</text>
  </g>
  <text x="300" y="490" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#334155" text-anchor="middle">a separate contract and setup for each line</text>

  <!-- AFTER -->
  <text x="900" y="100" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="19" font-weight="700" fill="#0e7490" text-anchor="middle">After: one connection to a shared hub</text>

  <g stroke="#0891b2" stroke-width="2.5">
    <line x1="900" y1="290" x2="900" y2="160"/>
    <line x1="900" y1="290" x2="760" y2="280"/>
    <line x1="900" y1="290" x2="1040" y2="280"/>
    <line x1="900" y1="290" x2="820" y2="420"/>
    <line x1="900" y1="290" x2="980" y2="420"/>
  </g>
  <circle cx="900" cy="290" r="48" fill="#0e7490"/>
  <text x="900" y="286" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Shared</text>
  <text x="900" y="306" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">hub</text>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#0b1f3a" text-anchor="middle">
    <circle cx="900" cy="160" r="34" fill="#ffffff" stroke="#0e7490" stroke-width="2"/><text x="900" y="165">Hospital</text>
    <circle cx="760" cy="280" r="34" fill="#ffffff" stroke="#0e7490" stroke-width="2"/><text x="760" y="285">Clinic</text>
    <circle cx="1040" cy="280" r="34" fill="#ffffff" stroke="#0e7490" stroke-width="2"/><text x="1040" y="285">Lab</text>
    <circle cx="820" cy="420" r="34" fill="#ffffff" stroke="#0e7490" stroke-width="2"/><text x="820" y="425">Payer</text>
    <circle cx="980" cy="420" r="34" fill="#ffffff" stroke="#0e7490" stroke-width="2"/><text x="980" y="425">Public</text>
  </g>
  <text x="900" y="490" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#334155" text-anchor="middle">one agreement; the hub reaches the rest</text>

  <line x1="600" y1="130" x2="600" y2="500" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 6"/>
  <text x="60" y="534" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#334155">The hub is called a QHIN. Your organisation joins one network and, through it, can exchange records with the whole country.</text>
</svg>
