<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" width="1200" height="530" role="img" aria-label="An app asks the authorization server for access with PKCE. The user signs in and consents to scopes. The server issues an access token and refresh token. The app calls the FHIR API with the token, and granular scopes decide what it may read. Backend services use signed client assertions instead.">
  <title>SMART on FHIR authorization</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="flowLine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/><stop offset="100%" stop-color="#6366f1" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.45"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/>
    </marker>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="530" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="530" rx="18" fill="url(#grid)" opacity="0.55"/>
  <text x="64" y="64" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f1f5f9" text-anchor="start" opacity="1">How a SMART app gets access to FHIR data</text>
  <rect x="64" y="110" width="310" height="120" rx="14" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5" filter="url(#lift)"/>
  <text x="88" y="152" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#fff" text-anchor="start" opacity="1">App</text>
  <text x="88" y="182.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#94a3b8" text-anchor="start" opacity="1">patient, clinician</text>
  <text x="88" y="204.475" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#94a3b8" text-anchor="start" opacity="1">or backend</text>
  <rect x="444" y="110" width="310" height="120" rx="14" fill="url(#hero)" stroke="#3b82f6" stroke-width="1.5" filter="url(#lift)"/>
  <text x="468" y="152" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#fff" text-anchor="start" opacity="1">Authorization server</text>
  <text x="468" y="182.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#e0f2fe" text-anchor="start" opacity="1">sign-in, consent,</text>
  <text x="468" y="204.475" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#e0f2fe" text-anchor="start" opacity="1">tokens</text>
  <rect x="824" y="110" width="310" height="120" rx="14" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" filter="url(#lift)"/>
  <text x="848" y="152" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#fff" text-anchor="start" opacity="1">FHIR API</text>
  <text x="848" y="182.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#94a3b8" text-anchor="start" opacity="1">scopes enforced</text>
  <text x="848" y="204.475" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#94a3b8" text-anchor="start" opacity="1">on every call</text>
  <line x1="219" y1="234" x2="219" y2="452" stroke="#334155" stroke-width="2" stroke-dasharray="4 6"/>
  <line x1="599" y1="234" x2="599" y2="452" stroke="#334155" stroke-width="2" stroke-dasharray="4 6"/>
  <line x1="979" y1="234" x2="979" y2="452" stroke="#334155" stroke-width="2" stroke-dasharray="4 6"/>
  <line x1="225" y1="272" x2="591" y2="272" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" marker-end="url(#tip)"/>
  <text x="409.0" y="262" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#f1f5f9" text-anchor="middle" opacity="1">1  authorize, with PKCE</text>
  <rect x="429" y="298" width="340" height="34" rx="17" fill="#273449" stroke="#3b82f6" stroke-width="1.5" />
  <text x="599" y="321" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#f1f5f9" text-anchor="middle" opacity="1">2  user signs in and consents to scopes</text>
  <line x1="593" y1="384" x2="227" y2="384" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" marker-end="url(#tip)" stroke-dasharray="7 6"/>
  <text x="409.0" y="374" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#f1f5f9" text-anchor="middle" opacity="1">3  access and refresh tokens</text>
  <line x1="225" y1="436" x2="971" y2="436" stroke="#6366f1" stroke-width="3" stroke-linecap="round" marker-end="url(#tip)"/>
  <text x="599.0" y="426" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#f1f5f9" text-anchor="middle" opacity="1">4  call FHIR: only what the scopes allow</text>
  <rect x="64" y="470" width="405" height="29" rx="14.5" fill="#2dd4bf" fill-opacity="0.16" stroke="#2dd4bf" stroke-opacity="0.6"/>
  <text x="266.65" y="488" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#2dd4bf" text-anchor="middle" opacity="1">Inferno SMART App Launch STU2.2: 80 of 80</text>
</svg>
