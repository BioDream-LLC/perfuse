<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Six steps from left to right: export from Mirth, perfuse explain, perfuse translate, perfuse check and test, perfuse compare on real traffic, then switch over one channel at a time. An arrow back shows channels can be exported to Mirth again.">
  <title>Mirth migration in six steps</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="flowLine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/><stop offset="100%" stop-color="#6366f1" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.45"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/>
    </marker>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="470" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="470" rx="18" fill="url(#grid)" opacity="0.55"/>
  <text x="64" y="64" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f1f5f9" text-anchor="start" opacity="1">From Mirth to Perfuse in six steps</text>
  <rect x="64" y="130" width="160" height="200" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#lift)"/>
  <circle cx="96" cy="166" r="18" fill="#273449" stroke="#22d3ee" stroke-width="2" />
  <text x="96" y="172" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#22d3ee" text-anchor="middle" opacity="1">1</text>
  <text x="82" y="222" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="start" opacity="1">Export</text>
  <text x="82" y="252.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="start" opacity="1">channels, groups,</text>
  <text x="82" y="273.75" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="start" opacity="1">or a backup</text>
  <text x="82" y="312" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#fbbf24" text-anchor="start" opacity="1">Mirth / OIE</text>
  <line x1="228" y1="230" x2="250" y2="230" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" marker-end="url(#tip)"/>
  <rect x="254" y="130" width="160" height="200" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#lift)"/>
  <circle cx="286" cy="166" r="18" fill="#273449" stroke="#22d3ee" stroke-width="2" />
  <text x="286" y="172" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#22d3ee" text-anchor="middle" opacity="1">2</text>
  <text x="272" y="222" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="start" opacity="1">Explain</text>
  <text x="272" y="252.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="start" opacity="1">what converts,</text>
  <text x="272" y="273.75" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="start" opacity="1">by name</text>
  <text x="272" y="312" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#fbbf24" text-anchor="start" opacity="1">perfuse explain</text>
  <line x1="418" y1="230" x2="440" y2="230" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" marker-end="url(#tip)"/>
  <rect x="444" y="130" width="160" height="200" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#lift)"/>
  <circle cx="476" cy="166" r="18" fill="#273449" stroke="#22d3ee" stroke-width="2" />
  <text x="476" y="172" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#22d3ee" text-anchor="middle" opacity="1">3</text>
  <text x="462" y="222" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="start" opacity="1">Translate</text>
  <text x="462" y="252.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="start" opacity="1">into Perfuse</text>
  <text x="462" y="273.75" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="start" opacity="1">channel files</text>
  <text x="462" y="312" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#fbbf24" text-anchor="start" opacity="1">perfuse translate</text>
  <line x1="608" y1="230" x2="630" y2="230" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" marker-end="url(#tip)"/>
  <rect x="634" y="130" width="160" height="200" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#lift)"/>
  <circle cx="666" cy="166" r="18" fill="#273449" stroke="#22d3ee" stroke-width="2" />
  <text x="666" y="172" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#22d3ee" text-anchor="middle" opacity="1">4</text>
  <text x="652" y="222" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="start" opacity="1">Check &amp; test</text>
  <text x="652" y="252.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="start" opacity="1">validate and</text>
  <text x="652" y="273.75" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="start" opacity="1">run your tests</text>
  <text x="652" y="312" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#fbbf24" text-anchor="start" opacity="1">perfuse test</text>
  <line x1="798" y1="230" x2="820" y2="230" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" marker-end="url(#tip)"/>
  <rect x="824" y="130" width="160" height="200" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#lift)"/>
  <circle cx="856" cy="166" r="18" fill="#273449" stroke="#22d3ee" stroke-width="2" />
  <text x="856" y="172" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#22d3ee" text-anchor="middle" opacity="1">5</text>
  <text x="842" y="222" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="start" opacity="1">Compare</text>
  <text x="842" y="252.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="start" opacity="1">both engines,</text>
  <text x="842" y="273.75" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="start" opacity="1">real traffic</text>
  <text x="842" y="312" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#fbbf24" text-anchor="start" opacity="1">perfuse compare</text>
  <line x1="988" y1="230" x2="1010" y2="230" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" marker-end="url(#tip)"/>
  <rect x="1014" y="130" width="160" height="200" rx="14" fill="url(#hero)" stroke="none" stroke-width="1.5" filter="url(#lift)"/>
  <circle cx="1046" cy="166" r="18" fill="#0f172a" stroke="#22d3ee" stroke-width="2" />
  <text x="1046" y="172" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#22d3ee" text-anchor="middle" opacity="1">6</text>
  <text x="1032" y="222" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="start" opacity="1">Switch</text>
  <text x="1032" y="252.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#e0f2fe" text-anchor="start" opacity="1">one channel</text>
  <text x="1032" y="273.75" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#e0f2fe" text-anchor="start" opacity="1">at a time</text>
  <text x="1032" y="312" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#fff" text-anchor="start" opacity="1">perfuse serve</text>
  <path d="M1094.0 336 C 1094.0 420, 144 420, 144 340" fill="none" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 7" marker-end="url(#tip)"/>
  <text x="600" y="440" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#2dd4bf" text-anchor="middle" opacity="1">and back: Perfuse writes Mirth channel files that Mirth, OIE and BridgeLink accept</text>
</svg>
