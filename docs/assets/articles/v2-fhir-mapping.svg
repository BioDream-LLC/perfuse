<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Mapping diagram. On the left, HL7 v2 segments: PID, PV1, OBR, OBX, AL1, DG1. On the right, the FHIR resources they become: Patient, Encounter, DiagnosticReport, Observation, AllergyIntolerance, Condition.">
  <title>HL7 v2 segments mapped to FHIR resources</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="flowLine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/><stop offset="100%" stop-color="#6366f1" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.45"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/>
    </marker>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="520" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="520" rx="18" fill="url(#grid)" opacity="0.55"/>
  <text x="64" y="64" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f1f5f9" text-anchor="start" opacity="1">HL7 v2 segments become FHIR resources</text>
  <rect x="80" y="110" width="300" height="48" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" />
  <text x="104" y="141" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="18" font-weight="800" fill="#fbbf24" text-anchor="start" opacity="1">PID</text>
  <text x="170" y="141" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#94a3b8" text-anchor="start" opacity="1">patient identity</text>
  <path d="M390 134 C 560 134, 640 134, 806 134" fill="none" stroke="url(#flowLine)" stroke-width="3" stroke-linecap="round" marker-end="url(#tip)"/>
  <rect x="820" y="110" width="300" height="48" rx="12" fill="#273449" stroke="#2dd4bf" stroke-width="1.5" />
  <circle cx="846" cy="134" r="7" fill="#2dd4bf" stroke="none" stroke-width="0" />
  <text x="866" y="140" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#f1f5f9" text-anchor="start" opacity="1">Patient</text>
  <rect x="80" y="174" width="300" height="48" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" />
  <text x="104" y="205" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="18" font-weight="800" fill="#fbbf24" text-anchor="start" opacity="1">PV1</text>
  <text x="170" y="205" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#94a3b8" text-anchor="start" opacity="1">the visit</text>
  <path d="M390 198 C 560 198, 640 198, 806 198" fill="none" stroke="url(#flowLine)" stroke-width="3" stroke-linecap="round" marker-end="url(#tip)"/>
  <rect x="820" y="174" width="300" height="48" rx="12" fill="#273449" stroke="#2dd4bf" stroke-width="1.5" />
  <circle cx="846" cy="198" r="7" fill="#2dd4bf" stroke="none" stroke-width="0" />
  <text x="866" y="204" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#f1f5f9" text-anchor="start" opacity="1">Encounter</text>
  <rect x="80" y="238" width="300" height="48" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" />
  <text x="104" y="269" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="18" font-weight="800" fill="#fbbf24" text-anchor="start" opacity="1">OBR</text>
  <text x="170" y="269" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#94a3b8" text-anchor="start" opacity="1">the order or report</text>
  <path d="M390 262 C 560 262, 640 262, 806 262" fill="none" stroke="url(#flowLine)" stroke-width="3" stroke-linecap="round" marker-end="url(#tip)"/>
  <rect x="820" y="238" width="300" height="48" rx="12" fill="#273449" stroke="#2dd4bf" stroke-width="1.5" />
  <circle cx="846" cy="262" r="7" fill="#2dd4bf" stroke="none" stroke-width="0" />
  <text x="866" y="268" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#f1f5f9" text-anchor="start" opacity="1">DiagnosticReport</text>
  <rect x="80" y="302" width="300" height="48" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" />
  <text x="104" y="333" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="18" font-weight="800" fill="#fbbf24" text-anchor="start" opacity="1">OBX</text>
  <text x="170" y="333" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#94a3b8" text-anchor="start" opacity="1">each result</text>
  <path d="M390 326 C 560 326, 640 326, 806 326" fill="none" stroke="url(#flowLine)" stroke-width="3" stroke-linecap="round" marker-end="url(#tip)"/>
  <rect x="820" y="302" width="300" height="48" rx="12" fill="#273449" stroke="#2dd4bf" stroke-width="1.5" />
  <circle cx="846" cy="326" r="7" fill="#2dd4bf" stroke="none" stroke-width="0" />
  <text x="866" y="332" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#f1f5f9" text-anchor="start" opacity="1">Observation</text>
  <rect x="80" y="366" width="300" height="48" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" />
  <text x="104" y="397" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="18" font-weight="800" fill="#fbbf24" text-anchor="start" opacity="1">AL1</text>
  <text x="170" y="397" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#94a3b8" text-anchor="start" opacity="1">an allergy</text>
  <path d="M390 390 C 560 390, 640 390, 806 390" fill="none" stroke="url(#flowLine)" stroke-width="3" stroke-linecap="round" marker-end="url(#tip)"/>
  <rect x="820" y="366" width="300" height="48" rx="12" fill="#273449" stroke="#2dd4bf" stroke-width="1.5" />
  <circle cx="846" cy="390" r="7" fill="#2dd4bf" stroke="none" stroke-width="0" />
  <text x="866" y="396" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#f1f5f9" text-anchor="start" opacity="1">AllergyIntolerance</text>
  <rect x="80" y="430" width="300" height="48" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" />
  <text x="104" y="461" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="18" font-weight="800" fill="#fbbf24" text-anchor="start" opacity="1">DG1</text>
  <text x="170" y="461" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#94a3b8" text-anchor="start" opacity="1">a diagnosis</text>
  <path d="M390 454 C 560 454, 640 454, 806 454" fill="none" stroke="url(#flowLine)" stroke-width="3" stroke-linecap="round" marker-end="url(#tip)"/>
  <rect x="820" y="430" width="300" height="48" rx="12" fill="#273449" stroke="#2dd4bf" stroke-width="1.5" />
  <circle cx="846" cy="454" r="7" fill="#2dd4bf" stroke="none" stroke-width="0" />
  <text x="866" y="460" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#f1f5f9" text-anchor="start" opacity="1">Condition</text>
  <rect x="470" y="488" width="493" height="28" rx="14.0" fill="#22d3ee" fill-opacity="0.16" stroke="#22d3ee" stroke-opacity="0.6"/>
  <text x="716.36" y="505" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#22d3ee" text-anchor="middle" opacity="1">dates · identifiers · codes · units · status · US Core</text>
</svg>
