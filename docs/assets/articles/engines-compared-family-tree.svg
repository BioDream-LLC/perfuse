<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="A family tree. Mirth Connect 4.5.2, the last open-source release under the Mozilla Public License, is the root. Two community forks continue its line: the Open Integration Engine and BridgeLink, both on Java with the same channel format. Perfuse is drawn to the side as a separate new engine written in Go under Apache 2.0, connected to the family by a dashed line labelled reads and writes Mirth channels, not by descent.">
  <title>The Mirth 4.5.2 family, and where Perfuse sits</title>
  <rect width="1200" height="540" rx="16" fill="#ffffff"/>
  <text x="600" y="50" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="700" fill="#0b1f3a" text-anchor="middle">Who descends from whom</text>

  <!-- root -->
  <rect x="420" y="90" width="360" height="92" rx="12" fill="#eef2f6" stroke="#64748b" stroke-width="1.8"/>
  <text x="600" y="124" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#0b1f3a" text-anchor="middle">Mirth Connect 4.5.2</text>
  <text x="600" y="150" font-family="system-ui, sans-serif" font-size="15" fill="#475569" text-anchor="middle">the last open-source release (MPL 2.0)</text>
  <text x="600" y="172" font-family="system-ui, sans-serif" font-size="15" fill="#475569" text-anchor="middle">Mirth went commercial-only at 4.6</text>

  <!-- forks -->
  <g stroke="#64748b" stroke-width="2" fill="none">
    <path d="M600 182 V220 H340 V258"/>
    <path d="M600 182 V220 H860 V258"/>
  </g>

  <rect x="190" y="258" width="300" height="110" rx="12" fill="#f5f8fc" stroke="#0891b2" stroke-width="1.8"/>
  <text x="340" y="294" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0b1f3a" text-anchor="middle">Open Integration Engine</text>
  <text x="340" y="320" font-family="system-ui, sans-serif" font-size="15" fill="#475569" text-anchor="middle">community fork, continues openly</text>
  <text x="340" y="342" font-family="system-ui, sans-serif" font-size="15" fill="#475569" text-anchor="middle">Java &#183; same channel format</text>

  <rect x="710" y="258" width="300" height="110" rx="12" fill="#f5f8fc" stroke="#0891b2" stroke-width="1.8"/>
  <text x="860" y="294" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0b1f3a" text-anchor="middle">BridgeLink</text>
  <text x="860" y="320" font-family="system-ui, sans-serif" font-size="15" fill="#475569" text-anchor="middle">community fork, continues openly</text>
  <text x="860" y="342" font-family="system-ui, sans-serif" font-size="15" fill="#475569" text-anchor="middle">Java &#183; same channel format</text>

  <!-- Perfuse to the side -->
  <rect x="420" y="400" width="360" height="110" rx="12" fill="#e0f2f7" stroke="#0e7490" stroke-width="2.4"/>
  <text x="600" y="436" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#0b1f3a" text-anchor="middle">Perfuse</text>
  <text x="600" y="462" font-family="system-ui, sans-serif" font-size="15" fill="#0e7490" text-anchor="middle">a separate new engine &#8212; Go, Apache 2.0</text>
  <text x="600" y="484" font-family="system-ui, sans-serif" font-size="15" fill="#475569" text-anchor="middle">not a fork; written from scratch</text>

  <!-- dashed connections showing compatibility, not descent -->
  <defs>
    <marker id="et-both" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0e7490"/>
    </marker>
  </defs>
  <path d="M460 400 Q360 388 350 368" fill="none" stroke="#0e7490" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M740 400 Q850 388 858 368" fill="none" stroke="#0e7490" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M600 400 V190" fill="none" stroke="#0e7490" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="470" y="300" width="260" height="30" rx="8" fill="#ffffff" stroke="#0e7490" stroke-width="1.2"/>
  <text x="600" y="320" font-family="system-ui, sans-serif" font-size="14" fill="#0e7490" text-anchor="middle" font-weight="600">reads and writes Mirth channels</text>

  <text x="600" y="534" font-family="system-ui, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">The dashed lines are compatibility, not descent: Perfuse shares no code with the Mirth family but speaks its channel format in both directions.</text>
</svg>
