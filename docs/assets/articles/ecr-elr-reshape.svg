<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="Electronic lab reporting reshaping: a laboratory's everyday result message holds every test ordered. Perfuse keeps only the results that must be reported and writes a tidy ELR message, and it lists what the laboratory left out.">
  <title>Reshaping a lab result into a public health report</title>
  <rect width="1200" height="500" rx="18" fill="#f5f8fc"/>
  <text x="60" y="56" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700" fill="#0b1f3a">Keeping only the results that must be reported</text>

  <!-- before box -->
  <rect x="48" y="104" width="360" height="320" rx="14" fill="#ffffff" stroke="#0b1f3a" stroke-width="2"/>
  <text x="72" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0b1f3a">The lab's everyday message</text>
  <text x="72" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="17" fill="#64748b">every test on the order</text>

  <rect x="72" y="190" width="312" height="34" rx="8" fill="#eef4fb" stroke="#cbd5e1"/>
  <text x="88" y="213" font-family="system-ui, -apple-system, sans-serif" font-size="17" fill="#334155">Cholesterol</text>
  <rect x="72" y="232" width="312" height="34" rx="8" fill="#e6f4f7" stroke="#0891b2" stroke-width="2"/>
  <text x="88" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#0e7490">Measles result (positive)</text>
  <rect x="72" y="274" width="312" height="34" rx="8" fill="#eef4fb" stroke="#cbd5e1"/>
  <text x="88" y="297" font-family="system-ui, -apple-system, sans-serif" font-size="17" fill="#334155">Blood count</text>
  <rect x="72" y="316" width="312" height="34" rx="8" fill="#eef4fb" stroke="#cbd5e1"/>
  <text x="88" y="339" font-family="system-ui, -apple-system, sans-serif" font-size="17" fill="#334155">Vitamin D</text>
  <text x="88" y="384" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#64748b">only one of these is reportable</text>

  <!-- Perfuse middle -->
  <rect x="470" y="190" width="200" height="140" rx="14" fill="#0e7490"/>
  <text x="570" y="252" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">Perfuse</text>
  <text x="570" y="282" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#e0f2fe" text-anchor="middle">keeps the</text>
  <text x="570" y="304" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#e0f2fe" text-anchor="middle">reportable ones</text>

  <line x1="408" y1="260" x2="468" y2="260" stroke="#0e7490" stroke-width="4" stroke-linecap="round" marker-end="url(#b)"/>
  <line x1="670" y1="260" x2="730" y2="260" stroke="#0e7490" stroke-width="4" stroke-linecap="round" marker-end="url(#b)"/>

  <!-- after box -->
  <rect x="732" y="104" width="420" height="240" rx="14" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
  <text x="756" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0b1f3a">The ELR message to public health</text>
  <text x="756" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="17" fill="#64748b">HL7 2.5.1, reportable results only</text>
  <rect x="756" y="190" width="372" height="34" rx="8" fill="#e6f4f7" stroke="#0891b2" stroke-width="2"/>
  <text x="772" y="213" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#0e7490">Measles result (positive)</text>
  <text x="772" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#334155">patient, ordering provider, specimen,</text>
  <text x="772" y="282" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#334155">performing laboratory, coded result</text>
  <text x="772" y="316" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#64748b">plus a note of anything the lab left out</text>

  <rect x="732" y="364" width="420" height="60" rx="14" fill="#ffffff" stroke="#0e7490" stroke-width="2"/>
  <text x="756" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#0b1f3a">In plain words:</text>
  <text x="756" y="414" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#334155">public health gets the measles result, not the cholesterol.</text>

  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0e7490"/>
    </marker>
  </defs>
</svg>
