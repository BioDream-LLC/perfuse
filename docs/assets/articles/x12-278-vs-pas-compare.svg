<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="A comparison of two ways to ask a health plan for approval. The X12 278 is the older way, used by plans and clearinghouses for years, written as rows of codes, with the proof sent in a separate message. The FHIR PAS is the newer way, the one the rule requires from 2027, written as a package of health records, with the proof attached in the same message, and able to carry the answer back quickly.">
  <title>X12 278 and FHIR PAS compared</title>
  <defs>
    <filter id="s5" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0b1f3a" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1200" height="560" rx="18" fill="#f5f8fc"/>
  <text x="600" y="56" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="700" fill="#0b1f3a" text-anchor="middle">Two languages for the same request</text>

  <rect x="70" y="92" width="510" height="430" rx="16" fill="#ffffff" stroke="#64748b" stroke-width="2" filter="url(#s5)"/>
  <text x="325" y="136" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#0b1f3a" text-anchor="middle">X12 278</text>
  <text x="325" y="162" font-family="system-ui, sans-serif" font-size="15" fill="#64748b" text-anchor="middle">the long-standing way</text>

  <text x="100" y="208" font-family="system-ui, sans-serif" font-size="17" fill="#334155">The one plans and clearinghouses</text>
  <text x="100" y="230" font-family="system-ui, sans-serif" font-size="17" fill="#334155">have used for years</text>
  <text x="100" y="272" font-family="system-ui, sans-serif" font-size="17" fill="#334155">Written as rows of codes</text>
  <text x="100" y="314" font-family="system-ui, sans-serif" font-size="17" fill="#334155">The proof travels separately</text>
  <text x="100" y="336" font-family="system-ui, sans-serif" font-size="17" fill="#334155">(in a companion message)</text>

  <rect x="100" y="368" width="450" height="120" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="118" y="398" font-family="ui-monospace, 'Courier New', monospace" font-size="15" fill="#475569">ISA*00*          *00* ...</text>
  <text x="118" y="424" font-family="ui-monospace, 'Courier New', monospace" font-size="15" fill="#475569">HL*1**20*1</text>
  <text x="118" y="450" font-family="ui-monospace, 'Courier New', monospace" font-size="15" fill="#475569">UM*HS*I*...</text>
  <text x="118" y="476" font-family="ui-monospace, 'Courier New', monospace" font-size="15" fill="#475569">HCR*A1*...</text>

  <rect x="620" y="92" width="510" height="430" rx="16" fill="#e0f2f7" stroke="#0891b2" stroke-width="2.5" filter="url(#s5)"/>
  <text x="875" y="136" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#0e7490" text-anchor="middle">FHIR PAS</text>
  <text x="875" y="162" font-family="system-ui, sans-serif" font-size="15" fill="#0e7490" text-anchor="middle">the way the rule requires from 2027</text>

  <text x="650" y="208" font-family="system-ui, sans-serif" font-size="17" fill="#0b1f3a">Built on modern health records</text>
  <text x="650" y="230" font-family="system-ui, sans-serif" font-size="17" fill="#0b1f3a">(FHIR)</text>
  <text x="650" y="272" font-family="system-ui, sans-serif" font-size="17" fill="#0b1f3a">Written as a package of records</text>
  <text x="650" y="314" font-family="system-ui, sans-serif" font-size="17" fill="#0b1f3a">The proof is attached in the</text>
  <text x="650" y="336" font-family="system-ui, sans-serif" font-size="17" fill="#0b1f3a">same request</text>

  <rect x="650" y="368" width="450" height="120" rx="10" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="668" y="398" font-family="ui-monospace, 'Courier New', monospace" font-size="15" fill="#0e7490">{ "resourceType": "Bundle",</text>
  <text x="668" y="424" font-family="ui-monospace, 'Courier New', monospace" font-size="15" fill="#0e7490">  "entry": [ Claim,</text>
  <text x="668" y="450" font-family="ui-monospace, 'Courier New', monospace" font-size="15" fill="#0e7490">    Patient, Coverage,</text>
  <text x="668" y="476" font-family="ui-monospace, 'Courier New', monospace" font-size="15" fill="#0e7490">    documentation ] }</text>
</svg>
