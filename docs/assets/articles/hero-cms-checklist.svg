<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Banner: the four CMS-0057-F APIs as a checklist.">
  <title>January 2027: a payer&#x27;s readiness checklist</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/></linearGradient>
    <linearGradient id="flowLine" gradientUnits="userSpaceOnUse" x1="640" y1="0" x2="1150" y2="0"><stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#6366f1"/></linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5"><stop offset="0%" stop-color="#3b82f6" stop-opacity="0.45"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/></filter>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/></marker>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)" opacity="0.55"/>
  <circle cx="930" cy="180" r="260" fill="url(#halo)"/>
  <rect x="64" y="64" width="136" height="29" rx="14.5" fill="#22d3ee" fill-opacity="0.16" stroke="#22d3ee" stroke-opacity="0.6"/>
  <text x="132.0" y="82" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#22d3ee" text-anchor="middle">CMS-0057-F</text>
  <text x="64" y="150" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="700" fill="#f1f5f9">January 2027:</text>
  <text x="64" y="206" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="700" fill="#f1f5f9">a payer&#x27;s readiness checklist</text>
  <text x="64" y="252" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" fill="#94a3b8">The four APIs, the decision timeframes, and what to test first</text>
  <rect x="700" y="70" width="420" height="59" rx="12" fill="#0b1220" stroke="#22d3ee" stroke-opacity="0.8" filter="url(#lift)"/>
  <circle cx="730" cy="100" r="7" fill="#22d3ee"/>
  <text x="752" y="106" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#e2e8f0">Patient and Provider Access</text>
  <path d="M910 129 L910 150" stroke="url(#flowLine)" stroke-width="3" fill="none" marker-end="url(#tip)"/>
  <rect x="700" y="151" width="420" height="59" rx="12" fill="#0b1220" stroke="#3b82f6" stroke-opacity="0.8" filter="url(#lift)"/>
  <circle cx="730" cy="181" r="7" fill="#3b82f6"/>
  <text x="752" y="187" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#e2e8f0">Payer-to-Payer</text>
  <path d="M910 210 L910 231" stroke="url(#flowLine)" stroke-width="3" fill="none" marker-end="url(#tip)"/>
  <rect x="700" y="232" width="420" height="59" rx="12" fill="#0b1220" stroke="#6366f1" stroke-opacity="0.8" filter="url(#lift)"/>
  <circle cx="730" cy="262" r="7" fill="#6366f1"/>
  <text x="752" y="268" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#e2e8f0">Prior Authorization, 2.1.0 and 2.2</text>
</svg>
