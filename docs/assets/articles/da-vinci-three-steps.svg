<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Three steps named CRD, DTR and PAS. CRD asks: does this order need approval, and what proof is needed. DTR gathers the proof on a form that fills itself in from the patient record. PAS sends the request and brings back the decision. Together they are the plan's Prior Authorization service that the rule requires from January 2027.">
  <title>CRD, DTR and PAS in plain words</title>
  <defs>
    <linearGradient id="b3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#eef4fb"/>
    </linearGradient>
    <filter id="s3" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0b1f3a" flood-opacity="0.14"/>
    </filter>
    <marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0891b2"/>
    </marker>
  </defs>
  <rect width="1200" height="560" rx="18" fill="#f5f8fc"/>
  <text x="600" y="56" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="700" fill="#0b1f3a" text-anchor="middle">Three steps, three short names</text>

  <rect x="70" y="110" width="320" height="360" rx="16" fill="url(#b3)" stroke="#0891b2" stroke-width="2.5" filter="url(#s3)"/>
  <text x="230" y="162" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#0e7490" text-anchor="middle">CRD</text>
  <text x="230" y="196" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0b1f3a" text-anchor="middle">Coverage Requirements</text>
  <text x="230" y="218" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0b1f3a" text-anchor="middle">Discovery</text>
  <line x1="110" y1="244" x2="350" y2="244" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="230" y="286" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#0b1f3a" text-anchor="middle">The question</text>
  <text x="230" y="322" font-family="system-ui, sans-serif" font-size="16" fill="#334155" text-anchor="middle">Does this order need</text>
  <text x="230" y="346" font-family="system-ui, sans-serif" font-size="16" fill="#334155" text-anchor="middle">the plan's approval?</text>
  <text x="230" y="382" font-family="system-ui, sans-serif" font-size="16" fill="#334155" text-anchor="middle">And if so, what proof</text>
  <text x="230" y="406" font-family="system-ui, sans-serif" font-size="16" fill="#334155" text-anchor="middle">does it want?</text>
  <text x="230" y="446" font-family="system-ui, sans-serif" font-size="15" fill="#0e7490" text-anchor="middle">Answered while the doctor</text>

  <rect x="440" y="110" width="320" height="360" rx="16" fill="url(#b3)" stroke="#0891b2" stroke-width="2.5" filter="url(#s3)"/>
  <text x="600" y="162" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#0e7490" text-anchor="middle">DTR</text>
  <text x="600" y="196" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0b1f3a" text-anchor="middle">Documentation Templates</text>
  <text x="600" y="218" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0b1f3a" text-anchor="middle">and Rules</text>
  <line x1="480" y1="244" x2="720" y2="244" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="600" y="286" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#0b1f3a" text-anchor="middle">The paperwork</text>
  <text x="600" y="322" font-family="system-ui, sans-serif" font-size="16" fill="#334155" text-anchor="middle">A form that fills itself</text>
  <text x="600" y="346" font-family="system-ui, sans-serif" font-size="16" fill="#334155" text-anchor="middle">in from the patient's</text>
  <text x="600" y="370" font-family="system-ui, sans-serif" font-size="16" fill="#334155" text-anchor="middle">chart, so the doctor</text>
  <text x="600" y="394" font-family="system-ui, sans-serif" font-size="16" fill="#334155" text-anchor="middle">only checks and</text>
  <text x="600" y="418" font-family="system-ui, sans-serif" font-size="16" fill="#334155" text-anchor="middle">completes it</text>

  <rect x="810" y="110" width="320" height="360" rx="16" fill="url(#b3)" stroke="#0891b2" stroke-width="2.5" filter="url(#s3)"/>
  <text x="970" y="162" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#0e7490" text-anchor="middle">PAS</text>
  <text x="970" y="196" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0b1f3a" text-anchor="middle">Prior Authorization</text>
  <text x="970" y="218" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0b1f3a" text-anchor="middle">Support</text>
  <line x1="850" y1="244" x2="1090" y2="244" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="970" y="286" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#0b1f3a" text-anchor="middle">The request</text>
  <text x="970" y="322" font-family="system-ui, sans-serif" font-size="16" fill="#334155" text-anchor="middle">Sends it all to the</text>
  <text x="970" y="346" font-family="system-ui, sans-serif" font-size="16" fill="#334155" text-anchor="middle">plan and brings back</text>
  <text x="970" y="370" font-family="system-ui, sans-serif" font-size="16" fill="#334155" text-anchor="middle">the decision: yes, no,</text>
  <text x="970" y="394" font-family="system-ui, sans-serif" font-size="16" fill="#334155" text-anchor="middle">changed, or waiting</text>

  <line x1="392" y1="290" x2="438" y2="290" stroke="#0891b2" stroke-width="3.5" marker-end="url(#a3)"/>
  <line x1="762" y1="290" x2="808" y2="290" stroke="#0891b2" stroke-width="3.5" marker-end="url(#a3)"/>

  <text x="600" y="516" font-family="system-ui, sans-serif" font-size="17" fill="#334155" text-anchor="middle">Together they are the plan's Prior Authorization service, required from January 2027.</text>
</svg>
