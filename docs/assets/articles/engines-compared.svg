<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Comparison of runtime and channel format. Mirth Connect 4.5.2, Open Integration Engine and BridgeLink run on Java and share Mirth&#x27;s channel format. Perfuse is a single native binary that imports and exports Mirth channels and adds FHIR, Da Vinci, CMS-0057, shadow mode and feed contracts.">
  <title>Open-source Mirth-family engines and Perfuse</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="flowLine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/><stop offset="100%" stop-color="#6366f1" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.45"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/>
    </marker>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="470" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="470" rx="18" fill="url(#grid)" opacity="0.55"/>
  <text x="64" y="64" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f1f5f9" text-anchor="start" opacity="1">Same channels, a new foundation</text>
  <rect x="64" y="110" width="520" height="320" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#lift)"/>
  <text x="92" y="152" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f1f5f9" text-anchor="start" opacity="1">Mirth 4.5.2, OIE, BridgeLink</text>
  <circle cx="100" cy="196" r="6" fill="#64748b" stroke="none" stroke-width="0" />
  <text x="118" y="202" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="400" fill="#94a3b8" text-anchor="start" opacity="1">the Mirth 4.5.2 code base</text>
  <circle cx="100" cy="246" r="6" fill="#64748b" stroke="none" stroke-width="0" />
  <text x="118" y="252" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="400" fill="#94a3b8" text-anchor="start" opacity="1">Java runtime and application server</text>
  <circle cx="100" cy="296" r="6" fill="#64748b" stroke="none" stroke-width="0" />
  <text x="118" y="302" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="400" fill="#94a3b8" text-anchor="start" opacity="1">Mirth channel XML</text>
  <circle cx="100" cy="346" r="6" fill="#64748b" stroke="none" stroke-width="0" />
  <text x="118" y="352" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="400" fill="#94a3b8" text-anchor="start" opacity="1">a mature, familiar model</text>
  <rect x="616" y="110" width="520" height="320" rx="14" fill="url(#hero)" stroke="none" stroke-width="1.5" filter="url(#lift)"/>
  <text x="644" y="152" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#fff" text-anchor="start" opacity="1">Perfuse</text>
  <circle cx="652" cy="196" r="6" fill="#fff" stroke="none" stroke-width="0" />
  <text x="670" y="202" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="400" fill="#fff" text-anchor="start" opacity="1">a new engine, written in Go</text>
  <circle cx="652" cy="242" r="6" fill="#fff" stroke="none" stroke-width="0" />
  <text x="670" y="248" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="400" fill="#fff" text-anchor="start" opacity="1">one native file, 31 MB at rest</text>
  <circle cx="652" cy="288" r="6" fill="#fff" stroke="none" stroke-width="0" />
  <text x="670" y="294" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="400" fill="#fff" text-anchor="start" opacity="1">imports and exports Mirth channels</text>
  <circle cx="652" cy="334" r="6" fill="#fff" stroke="none" stroke-width="0" />
  <text x="670" y="340" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="400" fill="#fff" text-anchor="start" opacity="1">FHIR, Da Vinci, CMS-0057 built in</text>
  <circle cx="652" cy="380" r="6" fill="#fff" stroke="none" stroke-width="0" />
  <text x="670" y="386" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="400" fill="#fff" text-anchor="start" opacity="1">shadow mode and feed contracts</text>
</svg>
