<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="A payer in the centre, served by Perfuse, connected to four parties: members through the Patient Access API, providers through the Provider Access API, other payers through the Payer-to-Payer API, and clinicians ordering care through the Prior Authorization API, with the standards each uses.">
  <title>The four CMS-0057 APIs around a payer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="flowLine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/><stop offset="100%" stop-color="#6366f1" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.45"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/>
    </marker>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="520" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="520" rx="18" fill="url(#grid)" opacity="0.55"/>
  <circle cx="600" cy="270" r="190" fill="url(#halo)" stroke="none" stroke-width="0" />
  <rect x="470" y="205" width="260" height="130" rx="22" fill="url(#hero)" stroke="none" stroke-width="1.5" filter="url(#lift)"/>
  <text x="600" y="258" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" fill="#fff" text-anchor="middle" opacity="1">Payer</text>
  <text x="600" y="290" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#e0f2fe" text-anchor="middle" opacity="1">served by Perfuse</text>
  <rect x="64" y="60" width="300" height="100" rx="14" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5" filter="url(#lift)"/>
  <text x="88" y="96" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#f1f5f9" text-anchor="start" opacity="1">Members</text>
  <text x="88" y="122" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#22d3ee" text-anchor="start" opacity="1">Patient Access API</text>
  <text x="88" y="146" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#94a3b8" text-anchor="start" opacity="1">CARIN BB · PDex · SMART</text>
  <line x1="364" y1="110" x2="470" y2="240" stroke="#22d3ee" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
  <rect x="836" y="60" width="300" height="100" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#lift)"/>
  <text x="860" y="96" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#f1f5f9" text-anchor="start" opacity="1">Providers</text>
  <text x="860" y="122" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#3b82f6" text-anchor="start" opacity="1">Provider Access API</text>
  <text x="860" y="146" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#94a3b8" text-anchor="start" opacity="1">Bulk Data · opt-outs</text>
  <line x1="836" y1="110" x2="730" y2="240" stroke="#3b82f6" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
  <rect x="64" y="380" width="300" height="100" rx="14" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" filter="url(#lift)"/>
  <text x="88" y="416" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#f1f5f9" text-anchor="start" opacity="1">Other payers</text>
  <text x="88" y="442" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#6366f1" text-anchor="start" opacity="1">Payer-to-Payer API</text>
  <text x="88" y="466" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#94a3b8" text-anchor="start" opacity="1">HRex $member-match</text>
  <line x1="364" y1="430" x2="470" y2="300" stroke="#6366f1" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
  <rect x="836" y="380" width="300" height="100" rx="14" fill="#1e293b" stroke="#2dd4bf" stroke-width="1.5" filter="url(#lift)"/>
  <text x="860" y="416" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#f1f5f9" text-anchor="start" opacity="1">Clinicians ordering</text>
  <text x="860" y="442" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#2dd4bf" text-anchor="start" opacity="1">Prior Authorization API</text>
  <text x="860" y="466" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#94a3b8" text-anchor="start" opacity="1">CRD · DTR · PAS</text>
  <line x1="836" y1="430" x2="730" y2="300" stroke="#2dd4bf" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
</svg>
