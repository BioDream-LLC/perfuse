<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Flow: a CSV of the year&#x27;s prior authorization decisions goes into perfuse cms0057 metrics, which produces the public page in CMS&#x27;s layout, a CSV and JSON, covering approvals, denials, approvals after appeal, extensions and mean and median decision times.">
  <title>Prior authorization metrics</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="flowLine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/><stop offset="100%" stop-color="#6366f1" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.45"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/>
    </marker>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="470" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="470" rx="18" fill="url(#grid)" opacity="0.55"/>
  <text x="64" y="64" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f1f5f9" text-anchor="start" opacity="1">One year of decisions, one public page</text>
  <rect x="64" y="140" width="260" height="220" rx="14" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" filter="url(#lift)"/>
  <text x="88" y="184" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="19" font-weight="700" fill="#fbbf24" text-anchor="start" opacity="1">decisions.csv</text>
  <rect x="88" y="206" width="200" height="10" rx="5" fill="#334155"/>
  <rect x="88" y="232" width="160" height="10" rx="5" fill="#334155"/>
  <rect x="88" y="258" width="200" height="10" rx="5" fill="#334155"/>
  <rect x="88" y="284" width="160" height="10" rx="5" fill="#334155"/>
  <rect x="88" y="310" width="200" height="10" rx="5" fill="#334155"/>
  <rect x="420" y="170" width="300" height="160" rx="14" fill="url(#hero)" stroke="none" stroke-width="1.5" filter="url(#lift)"/>
  <text x="570" y="232" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="20" font-weight="800" fill="#fff" text-anchor="middle" opacity="1">perfuse cms0057</text>
  <text x="570" y="262" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="20" font-weight="800" fill="#fff" text-anchor="middle" opacity="1">metrics</text>
  <line x1="330" y1="250" x2="412" y2="250" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" marker-end="url(#tip)"/>
  <rect x="816" y="110" width="320" height="280" rx="14" fill="#1e293b" stroke="#2dd4bf" stroke-width="1.5" filter="url(#lift)"/>
  <text x="840" y="150" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#2dd4bf" text-anchor="start" opacity="1">Public page, CSV, JSON</text>
  <circle cx="848" cy="188" r="6" fill="#2dd4bf" stroke="none" stroke-width="0" />
  <text x="866" y="194" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#f1f5f9" text-anchor="start" opacity="1">approved</text>
  <circle cx="848" cy="228" r="6" fill="#2dd4bf" stroke="none" stroke-width="0" />
  <text x="866" y="234" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#f1f5f9" text-anchor="start" opacity="1">denied</text>
  <circle cx="848" cy="268" r="6" fill="#2dd4bf" stroke="none" stroke-width="0" />
  <text x="866" y="274" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#f1f5f9" text-anchor="start" opacity="1">approved after appeal</text>
  <circle cx="848" cy="308" r="6" fill="#2dd4bf" stroke="none" stroke-width="0" />
  <text x="866" y="314" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#f1f5f9" text-anchor="start" opacity="1">extended timeframe</text>
  <circle cx="848" cy="348" r="6" fill="#2dd4bf" stroke="none" stroke-width="0" />
  <text x="866" y="354" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#f1f5f9" text-anchor="start" opacity="1">mean and median days</text>
  <line x1="726" y1="250" x2="808" y2="250" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round" marker-end="url(#tip)"/>
  <rect x="64" y="420" width="580" height="28" rx="14.0" fill="#22d3ee" fill-opacity="0.16" stroke="#22d3ee" stroke-opacity="0.6"/>
  <text x="353.76" y="437" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#22d3ee" text-anchor="middle" opacity="1">standard and expedited reported separately, units always written</text>
</svg>
