<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Comparison. X12 278: the HIPAA transaction, batch-oriented, used by utilization management systems. FHIR PAS: a REST API inside the EHR workflow, with documentation attached and pended decisions pushed back. Perfuse sits between them and converts both ways.">
  <title>X12 278 and FHIR PAS</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="flowLine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/><stop offset="100%" stop-color="#6366f1" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.45"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/>
    </marker>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="470" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="470" rx="18" fill="url(#grid)" opacity="0.55"/>
  <text x="64" y="64" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f1f5f9" text-anchor="start" opacity="1">Two ways to ask for prior authorization, one engine between them</text>
  <rect x="64" y="120" width="300" height="300" rx="14" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" filter="url(#lift)"/>
  <text x="88" y="164" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#fbbf24" text-anchor="start" opacity="1">X12 278</text>
  <circle cx="94" cy="206" r="5" fill="#fbbf24" stroke="none" stroke-width="0" />
  <text x="110" y="212" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#f1f5f9" text-anchor="start" opacity="1">the HIPAA transaction</text>
  <circle cx="94" cy="254" r="5" fill="#fbbf24" stroke="none" stroke-width="0" />
  <text x="110" y="260" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#f1f5f9" text-anchor="start" opacity="1">segments and loops</text>
  <circle cx="94" cy="302" r="5" fill="#fbbf24" stroke="none" stroke-width="0" />
  <text x="110" y="308" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#f1f5f9" text-anchor="start" opacity="1">the payer&#x27;s UM system speaks it</text>
  <circle cx="94" cy="350" r="5" fill="#fbbf24" stroke="none" stroke-width="0" />
  <text x="110" y="356" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#f1f5f9" text-anchor="start" opacity="1">clearinghouses and EDI</text>
  <rect x="836" y="120" width="300" height="300" rx="14" fill="#1e293b" stroke="#2dd4bf" stroke-width="1.5" filter="url(#lift)"/>
  <text x="860" y="164" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#2dd4bf" text-anchor="start" opacity="1">FHIR PAS</text>
  <circle cx="866" cy="206" r="5" fill="#2dd4bf" stroke="none" stroke-width="0" />
  <text x="882" y="212" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#f1f5f9" text-anchor="start" opacity="1">a REST API, Claim/$submit</text>
  <circle cx="866" cy="254" r="5" fill="#2dd4bf" stroke="none" stroke-width="0" />
  <text x="882" y="260" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#f1f5f9" text-anchor="start" opacity="1">documentation attached</text>
  <circle cx="866" cy="302" r="5" fill="#2dd4bf" stroke="none" stroke-width="0" />
  <text x="882" y="308" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#f1f5f9" text-anchor="start" opacity="1">pended decisions pushed back</text>
  <circle cx="866" cy="350" r="5" fill="#2dd4bf" stroke="none" stroke-width="0" />
  <text x="882" y="356" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#f1f5f9" text-anchor="start" opacity="1">part of CMS-0057</text>
  <rect x="450" y="170" width="300" height="200" rx="14" fill="url(#hero)" stroke="none" stroke-width="1.5" filter="url(#lift)"/>
  <text x="600" y="228" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" fill="#fff" text-anchor="middle" opacity="1">Perfuse</text>
  <text x="600" y="266" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#e0f2fe" text-anchor="middle" opacity="1">PAS → 278 for the payer</text>
  <text x="600" y="294" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#e0f2fe" text-anchor="middle" opacity="1">278 → PAS ClaimResponse</text>
  <text x="600" y="322" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#e0f2fe" text-anchor="middle" opacity="1">validated by HL7&#x27;s validator</text>
  <line x1="370" y1="240" x2="444" y2="240" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round" marker-end="url(#tip)"/>
  <line x1="444" y1="300" x2="370" y2="300" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round" marker-end="url(#tip)" stroke-dasharray="7 6"/>
  <line x1="756" y1="240" x2="830" y2="240" stroke="#2dd4bf" stroke-width="3.5" stroke-linecap="round" marker-end="url(#tip)"/>
  <line x1="830" y1="300" x2="756" y2="300" stroke="#2dd4bf" stroke-width="3.5" stroke-linecap="round" marker-end="url(#tip)" stroke-dasharray="7 6"/>
</svg>
