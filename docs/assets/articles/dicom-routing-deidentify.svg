<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="De-identifying a medical image: before, the study carries the patient name, identifier and birth date and hidden private tags. Perfuse removes the patient, strips the private tags and sets a new label, so the study that reaches a research archive carries no patient.">
  <title>Removing the patient before an image leaves for research</title>
  <rect width="1200" height="500" rx="18" fill="#f5f8fc"/>
  <text x="60" y="56" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700" fill="#0b1f3a">Taking the patient out before an image is shared</text>

  <!-- before -->
  <rect x="48" y="104" width="360" height="300" rx="14" fill="#ffffff" stroke="#0b1f3a" stroke-width="2"/>
  <text x="72" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0b1f3a">The original study</text>
  <rect x="72" y="162" width="312" height="36" rx="8" fill="#fdecec" stroke="#dc2626"/>
  <text x="88" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="17" fill="#991b1b">Name: a real person</text>
  <rect x="72" y="208" width="312" height="36" rx="8" fill="#fdecec" stroke="#dc2626"/>
  <text x="88" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="17" fill="#991b1b">Patient identifier</text>
  <rect x="72" y="254" width="312" height="36" rx="8" fill="#fdecec" stroke="#dc2626"/>
  <text x="88" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="17" fill="#991b1b">Date of birth</text>
  <rect x="72" y="300" width="312" height="36" rx="8" fill="#fdecec" stroke="#dc2626"/>
  <text x="88" y="324" font-family="system-ui, -apple-system, sans-serif" font-size="17" fill="#991b1b">Hidden private tags</text>
  <text x="88" y="368" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#64748b">the image, plus who it belongs to</text>

  <!-- Perfuse -->
  <rect x="470" y="190" width="200" height="130" rx="14" fill="#0e7490"/>
  <text x="570" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">Perfuse</text>
  <text x="570" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#e0f2fe" text-anchor="middle">removes the</text>
  <text x="570" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#e0f2fe" text-anchor="middle">patient details</text>
  <line x1="408" y1="254" x2="468" y2="254" stroke="#0e7490" stroke-width="4" stroke-linecap="round" marker-end="url(#c)"/>
  <line x1="670" y1="254" x2="730" y2="254" stroke="#0e7490" stroke-width="4" stroke-linecap="round" marker-end="url(#c)"/>

  <!-- after -->
  <rect x="732" y="104" width="420" height="300" rx="14" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
  <text x="756" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0b1f3a">The de-identified study</text>
  <rect x="756" y="162" width="372" height="36" rx="8" fill="#e6f4f7" stroke="#0891b2"/>
  <text x="772" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="17" fill="#0e7490">Name: removed</text>
  <rect x="756" y="208" width="372" height="36" rx="8" fill="#e6f4f7" stroke="#0891b2"/>
  <text x="772" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="17" fill="#0e7490">Identifier: removed</text>
  <rect x="756" y="254" width="372" height="36" rx="8" fill="#e6f4f7" stroke="#0891b2"/>
  <text x="772" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="17" fill="#0e7490">Private tags: stripped</text>
  <rect x="756" y="300" width="372" height="36" rx="8" fill="#e6f4f7" stroke="#0891b2"/>
  <text x="772" y="324" font-family="system-ui, -apple-system, sans-serif" font-size="17" fill="#0e7490">New label set</text>
  <text x="772" y="368" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#64748b">the picture stays; the person is gone</text>

  <defs>
    <marker id="c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0e7490"/>
    </marker>
  </defs>
</svg>
