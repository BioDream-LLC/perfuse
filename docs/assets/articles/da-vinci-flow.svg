<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Sequence between the EHR and the payer. 1, CRD: the clinician signs an order and the payer answers whether prior authorization is needed and which questionnaire to use. 2, DTR: the questionnaire package returns and is pre-filled from the chart. 3, PAS: the request is submitted and a decision comes back, approved, denied or pended.">
  <title>Da Vinci prior authorization: CRD, DTR and PAS</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="flowLine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/><stop offset="100%" stop-color="#6366f1" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.45"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/>
    </marker>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="620" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="620" rx="18" fill="url(#grid)" opacity="0.55"/>
  <text x="64" y="64" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f1f5f9" text-anchor="start" opacity="1">From order to decision, inside the clinician&#x27;s workflow</text>
  <rect x="120" y="96" width="180" height="70" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="210" y="130" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="800" fill="#fff" text-anchor="middle" opacity="1">EHR</text>
  <text x="210" y="154" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#94a3b8" text-anchor="middle" opacity="1">clinician</text>
  <line x1="210" y1="170" x2="210" y2="590" stroke="#334155" stroke-width="2" stroke-dasharray="4 6"/>
  <rect x="900" y="96" width="180" height="70" rx="16" fill="url(#hero)" stroke="#334155" stroke-width="1.5" />
  <text x="990" y="130" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="800" fill="#fff" text-anchor="middle" opacity="1">Payer</text>
  <text x="990" y="154" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#e0f2fe" text-anchor="middle" opacity="1">Perfuse</text>
  <line x1="990" y1="170" x2="990" y2="590" stroke="#334155" stroke-width="2" stroke-dasharray="4 6"/>
  <rect x="574" y="192" width="54" height="30" rx="15.0" fill="#22d3ee" fill-opacity="0.16" stroke="#22d3ee" stroke-opacity="0.6"/>
  <text x="600.88" y="211" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#22d3ee" text-anchor="middle" opacity="1">CRD</text>
  <line x1="214" y1="262" x2="984" y2="262" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" marker-end="url(#tip)"/>
  <text x="600" y="252" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#f1f5f9" text-anchor="middle" opacity="1">order-sign over CDS Hooks</text>
  <line x1="986" y1="302" x2="216" y2="302" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" marker-end="url(#tip)" stroke-dasharray="8 6"/>
  <text x="600" y="294" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#94a3b8" text-anchor="middle" opacity="1">covered · auth needed · questionnaire</text>
  <rect x="574" y="322" width="54" height="30" rx="15.0" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-opacity="0.6"/>
  <text x="600.88" y="341" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#3b82f6" text-anchor="middle" opacity="1">DTR</text>
  <line x1="214" y1="392" x2="984" y2="392" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" marker-end="url(#tip)"/>
  <text x="600" y="382" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#f1f5f9" text-anchor="middle" opacity="1">$questionnaire-package</text>
  <line x1="986" y1="432" x2="216" y2="432" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" marker-end="url(#tip)" stroke-dasharray="8 6"/>
  <text x="600" y="424" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#94a3b8" text-anchor="middle" opacity="1">Questionnaire + CQL, pre-filled</text>
  <rect x="574" y="452" width="54" height="30" rx="15.0" fill="#6366f1" fill-opacity="0.16" stroke="#6366f1" stroke-opacity="0.6"/>
  <text x="600.88" y="471" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#6366f1" text-anchor="middle" opacity="1">PAS</text>
  <line x1="214" y1="522" x2="984" y2="522" stroke="#6366f1" stroke-width="3" stroke-linecap="round" marker-end="url(#tip)"/>
  <text x="600" y="512" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#f1f5f9" text-anchor="middle" opacity="1">Claim/$submit with documentation</text>
  <line x1="986" y1="562" x2="216" y2="562" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" marker-end="url(#tip)" stroke-dasharray="8 6"/>
  <text x="600" y="554" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#94a3b8" text-anchor="middle" opacity="1">approved · denied · pended</text>
</svg>
