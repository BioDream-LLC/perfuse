<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="How an electronic claim attachment travels: a clinician's document is turned into a C-CDA, signed electronically, placed inside an X12 275 transaction, sent to the payer, and the payer checks the signature before trusting it.">
  <title>How a signed claim attachment reaches the payer</title>
  <rect width="1200" height="480" rx="18" fill="#f5f8fc"/>
  <text x="60" y="56" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700" fill="#0b1f3a">A document, signed and sealed, on its way to the payer</text>

  <rect x="48" y="110" width="208" height="150" rx="14" fill="#ffffff" stroke="#0b1f3a" stroke-width="2"/>
  <circle cx="78" cy="142" r="16" fill="#0e7490"/>
  <text x="78" y="148" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="68" y="192" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0b1f3a">The document</text>
  <text x="68" y="220" font-family="system-ui, sans-serif" font-size="17" fill="#334155">An operative note</text>
  <text x="68" y="242" font-family="system-ui, sans-serif" font-size="17" fill="#334155">becomes a C-CDA.</text>

  <rect x="296" y="110" width="208" height="150" rx="14" fill="#ffffff" stroke="#0b1f3a" stroke-width="2"/>
  <circle cx="326" cy="142" r="16" fill="#0e7490"/>
  <text x="326" y="148" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="316" y="192" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0b1f3a">The signature</text>
  <text x="316" y="220" font-family="system-ui, sans-serif" font-size="17" fill="#334155">Signed, with a</text>
  <text x="316" y="242" font-family="system-ui, sans-serif" font-size="17" fill="#334155">time-stamp.</text>

  <rect x="544" y="110" width="208" height="150" rx="14" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
  <circle cx="574" cy="142" r="16" fill="#0e7490"/>
  <text x="574" y="148" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="564" y="192" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0b1f3a">The envelope</text>
  <text x="564" y="220" font-family="system-ui, sans-serif" font-size="17" fill="#334155">Placed inside an</text>
  <text x="564" y="242" font-family="system-ui, sans-serif" font-size="17" fill="#334155">X12 275.</text>

  <rect x="792" y="110" width="208" height="150" rx="14" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
  <circle cx="822" cy="142" r="16" fill="#0e7490"/>
  <text x="822" y="148" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="812" y="192" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0b1f3a">The journey</text>
  <text x="812" y="220" font-family="system-ui, sans-serif" font-size="17" fill="#334155">Sent to the</text>
  <text x="812" y="242" font-family="system-ui, sans-serif" font-size="17" fill="#334155">payer.</text>

  <rect x="1040" y="110" width="112" height="150" rx="14" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
  <circle cx="1070" cy="142" r="16" fill="#0e7490"/>
  <text x="1070" y="148" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <text x="1060" y="192" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0b1f3a">The check</text>
  <text x="1060" y="220" font-family="system-ui, sans-serif" font-size="17" fill="#334155">Signature</text>
  <text x="1060" y="242" font-family="system-ui, sans-serif" font-size="17" fill="#334155">verified.</text>

  <line x1="256" y1="185" x2="294" y2="185" stroke="#0e7490" stroke-width="4" stroke-linecap="round" marker-end="url(#d)"/>
  <line x1="504" y1="185" x2="542" y2="185" stroke="#0e7490" stroke-width="4" stroke-linecap="round" marker-end="url(#d)"/>
  <line x1="752" y1="185" x2="790" y2="185" stroke="#0e7490" stroke-width="4" stroke-linecap="round" marker-end="url(#d)"/>
  <line x1="1000" y1="185" x2="1038" y2="185" stroke="#0e7490" stroke-width="4" stroke-linecap="round" marker-end="url(#d)"/>

  <rect x="48" y="356" width="1104" height="80" rx="14" fill="#ffffff" stroke="#0e7490" stroke-width="2"/>
  <text x="72" y="394" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0b1f3a">In plain words:</text>
  <text x="72" y="420" font-family="system-ui, sans-serif" font-size="18" fill="#334155">the signature is like a wax seal, so the payer can tell the document really came from the clinic and was not changed.</text>

  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0e7490"/>
    </marker>
  </defs>
</svg>
