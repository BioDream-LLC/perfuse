<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="How the yearly page is made, in three steps. First, the plan's system already keeps a record of every request: when it arrived, whether it was urgent, when it was decided, the answer, whether extra time was taken, and whether it was appealed. Second, that record is exported as a simple spreadsheet file. Third, Perfuse reads the file, does the counting, and produces the finished public web page, plus the same figures as a spreadsheet and as data.">
  <title>From the plan's records to the published page</title>
  <defs>
    <linearGradient id="b8" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#eef4fb"/>
    </linearGradient>
    <filter id="s8" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0b1f3a" flood-opacity="0.14"/>
    </filter>
    <marker id="a8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0891b2"/>
    </marker>
  </defs>
  <rect width="1200" height="480" rx="18" fill="#f5f8fc"/>
  <text x="600" y="56" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="700" fill="#0b1f3a" text-anchor="middle">Turning records into the public page</text>

  <rect x="60" y="150" width="280" height="200" rx="16" fill="url(#b8)" stroke="#0891b2" stroke-width="2" filter="url(#s8)"/>
  <text x="200" y="196" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#0b1f3a" text-anchor="middle">The records</text>
  <text x="200" y="230" font-family="system-ui, sans-serif" font-size="15" fill="#334155" text-anchor="middle">The plan's system already</text>
  <text x="200" y="252" font-family="system-ui, sans-serif" font-size="15" fill="#334155" text-anchor="middle">notes, for each request:</text>
  <text x="200" y="282" font-family="system-ui, sans-serif" font-size="15" fill="#334155" text-anchor="middle">when it arrived, if urgent,</text>
  <text x="200" y="304" font-family="system-ui, sans-serif" font-size="15" fill="#334155" text-anchor="middle">when decided, the answer,</text>
  <text x="200" y="326" font-family="system-ui, sans-serif" font-size="15" fill="#334155" text-anchor="middle">extra time, any appeal</text>

  <rect x="460" y="150" width="280" height="200" rx="16" fill="url(#b8)" stroke="#0891b2" stroke-width="2" filter="url(#s8)"/>
  <text x="600" y="196" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#0b1f3a" text-anchor="middle">A simple file</text>
  <text x="600" y="230" font-family="system-ui, sans-serif" font-size="15" fill="#334155" text-anchor="middle">The records are exported</text>
  <text x="600" y="252" font-family="system-ui, sans-serif" font-size="15" fill="#334155" text-anchor="middle">as a spreadsheet (CSV),</text>
  <text x="600" y="274" font-family="system-ui, sans-serif" font-size="15" fill="#334155" text-anchor="middle">one row per request</text>
  <rect x="500" y="294" width="200" height="40" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="600" y="320" font-family="ui-monospace, 'Courier New', monospace" font-size="14" fill="#475569" text-anchor="middle">decisions.csv</text>

  <rect x="860" y="130" width="280" height="240" rx="16" fill="#0b1f3a" stroke="#0e7490" stroke-width="2.5" filter="url(#s8)"/>
  <text x="1000" y="178" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">Perfuse</text>
  <text x="1000" y="210" font-family="system-ui, sans-serif" font-size="15" fill="#bae6fd" text-anchor="middle">reads the file, counts,</text>
  <text x="1000" y="232" font-family="system-ui, sans-serif" font-size="15" fill="#bae6fd" text-anchor="middle">and produces:</text>
  <rect x="896" y="252" width="208" height="34" rx="8" fill="#0e7490"/>
  <text x="1000" y="275" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">a public web page</text>
  <rect x="896" y="294" width="208" height="34" rx="8" fill="#155e75"/>
  <text x="1000" y="317" font-family="system-ui, sans-serif" font-size="15" fill="#e0f2f7" text-anchor="middle">a spreadsheet</text>
  <rect x="896" y="336" width="208" height="22" rx="7" fill="#155e75"/>
  <text x="1000" y="353" font-family="system-ui, sans-serif" font-size="13" fill="#e0f2f7" text-anchor="middle">and data (JSON)</text>

  <line x1="345" y1="250" x2="455" y2="250" stroke="#0891b2" stroke-width="3.5" marker-end="url(#a8)"/>
  <line x1="745" y1="250" x2="855" y2="250" stroke="#0891b2" stroke-width="3.5" marker-end="url(#a8)"/>

  <text x="600" y="430" font-family="system-ui, sans-serif" font-size="16" fill="#334155" text-anchor="middle">The page is self-contained, ready to put straight on the plan's website.</text>
</svg>
