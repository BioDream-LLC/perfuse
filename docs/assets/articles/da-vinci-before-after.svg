<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="Before and after comparison. Before: the doctor finds out approval is needed only after the visit, hunts for the plan's rules, fills a form by hand, faxes it, and waits days for an answer, sometimes a denial with no clear reason. After: the computer says at the moment of ordering whether approval is needed, a form fills itself from the chart, the request is sent with the proof attached, and the answer often comes back in seconds.">
  <title>Prior authorization before and after Da Vinci</title>
  <defs>
    <filter id="s4" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0b1f3a" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1200" height="540" rx="18" fill="#f5f8fc"/>
  <text x="600" y="56" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="700" fill="#0b1f3a" text-anchor="middle">The same request, the old way and the new way</text>

  <rect x="70" y="92" width="510" height="410" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#s4)"/>
  <text x="325" y="136" font-family="system-ui, sans-serif" font-size="23" font-weight="800" fill="#64748b" text-anchor="middle">Before</text>
  <text x="325" y="162" font-family="system-ui, sans-serif" font-size="15" fill="#64748b" text-anchor="middle">phones, faxes and portals</text>

  <text x="100" y="214" font-family="system-ui, sans-serif" font-size="17" fill="#334155">1.  The visit ends, then someone notices</text>
  <text x="124" y="238" font-family="system-ui, sans-serif" font-size="17" fill="#334155">approval is needed</text>
  <text x="100" y="276" font-family="system-ui, sans-serif" font-size="17" fill="#334155">2.  Staff hunt for the plan's rules</text>
  <text x="100" y="314" font-family="system-ui, sans-serif" font-size="17" fill="#334155">3.  A form is filled in by hand</text>
  <text x="100" y="352" font-family="system-ui, sans-serif" font-size="17" fill="#334155">4.  It is faxed to the plan</text>
  <text x="100" y="390" font-family="system-ui, sans-serif" font-size="17" fill="#334155">5.  Everyone waits, often days</text>
  <text x="100" y="440" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#64748b">Sometimes a denial with no clear</text>
  <text x="100" y="464" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#64748b">reason, and a phone call to ask why</text>

  <rect x="620" y="92" width="510" height="410" rx="16" fill="#e0f2f7" stroke="#0891b2" stroke-width="2.5" filter="url(#s4)"/>
  <text x="875" y="136" font-family="system-ui, sans-serif" font-size="23" font-weight="800" fill="#0e7490" text-anchor="middle">After</text>
  <text x="875" y="162" font-family="system-ui, sans-serif" font-size="15" fill="#0e7490" text-anchor="middle">computer to computer</text>

  <text x="650" y="214" font-family="system-ui, sans-serif" font-size="17" fill="#0b1f3a">1.  At the moment of ordering, the</text>
  <text x="674" y="238" font-family="system-ui, sans-serif" font-size="17" fill="#0b1f3a">computer says if approval is needed</text>
  <text x="650" y="276" font-family="system-ui, sans-serif" font-size="17" fill="#0b1f3a">2.  A form fills itself from the chart</text>
  <text x="650" y="314" font-family="system-ui, sans-serif" font-size="17" fill="#0b1f3a">3.  The doctor checks and completes it</text>
  <text x="650" y="352" font-family="system-ui, sans-serif" font-size="17" fill="#0b1f3a">4.  The request is sent with its proof</text>
  <text x="650" y="390" font-family="system-ui, sans-serif" font-size="17" fill="#0b1f3a">5.  The answer often comes in seconds</text>
  <text x="650" y="440" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#0e7490">A denial always carries a reason,</text>
  <text x="650" y="464" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#0e7490">in the same answer</text>
</svg>
