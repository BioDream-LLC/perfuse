<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="A timeline of a silent interface failure. On day one a vendor upgrade quietly drops a field, and no error appears. For weeks everything looks fine. Later a downstream system falls over, and the investigation starts in the wrong place. A feed contract would have raised the alarm on day one.">
  <title>How a silent change becomes a late outage</title>
  <defs>
    <marker id="tip3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="520" rx="18" fill="#f5f8fc"/>
  <text x="60" y="56" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="26" font-weight="700" fill="#0b1f3a">Why the problem is found weeks too late</text>

  <!-- timeline -->
  <line x1="90" y1="250" x2="1120" y2="250" stroke="#64748b" stroke-width="3" marker-end="url(#tip3)"/>

  <!-- Day 1 -->
  <circle cx="200" cy="250" r="12" fill="#b91c1c"/>
  <rect x="90" y="110" width="260" height="110" rx="12" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <text x="110" y="140" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="700" fill="#b91c1c">Day 1</text>
  <text x="110" y="168" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#334155">a vendor upgrade quietly</text>
  <text x="110" y="190" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#334155">drops a field</text>
  <text x="110" y="212" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#7f1d1d">no error — nothing notices</text>
  <text x="200" y="300" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#334155" text-anchor="middle">the change</text>

  <!-- Weeks pass -->
  <circle cx="560" cy="250" r="10" fill="#64748b"/>
  <rect x="430" y="290" width="260" height="90" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="450" y="320" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="700" fill="#0b1f3a">Weeks pass</text>
  <text x="450" y="348" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#334155">messages still valid;</text>
  <text x="450" y="370" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#334155">everything looks fine</text>

  <!-- Outage -->
  <circle cx="960" cy="250" r="12" fill="#b91c1c"/>
  <rect x="830" y="110" width="290" height="110" rx="12" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <text x="850" y="140" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="700" fill="#b91c1c">Later</text>
  <text x="850" y="168" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#334155">a downstream system falls</text>
  <text x="850" y="190" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#334155">over; the hunt begins at</text>
  <text x="850" y="212" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#7f1d1d">the wrong end</text>
  <text x="960" y="300" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#334155" text-anchor="middle">the outage</text>

  <!-- contract catch -->
  <rect x="90" y="410" width="1030" height="78" rx="12" fill="#f0fdfa" stroke="#0e7490" stroke-width="2"/>
  <text x="114" y="442" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="700" fill="#0e7490">With a feed contract:</text>
  <text x="320" y="442" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" fill="#334155">the alarm goes off on Day 1, when the field stops arriving —</text>
  <text x="114" y="470" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" fill="#334155">weeks before the downstream system would ever have noticed, and pointing at the real cause.</text>
</svg>
