<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="The strength levels of an electronic signature, built up in layers: first the signature itself, then a trusted time-stamp proving when it was signed, then the certificate details and revocation status so the signature can still be checked years later.">
  <title>How a long-lasting electronic signature is built up</title>
  <rect width="1200" height="460" rx="18" fill="#f5f8fc"/>
  <text x="60" y="56" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700" fill="#0b1f3a">A signature that can still be checked years later</text>

  <!-- layer 1 base -->
  <rect x="300" y="320" width="600" height="70" rx="12" fill="#e6f4f7" stroke="#0b1f3a" stroke-width="2"/>
  <text x="600" y="352" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0b1f3a" text-anchor="middle">Layer 1: the signature and its policy</text>
  <text x="600" y="376" font-family="system-ui, sans-serif" font-size="16" fill="#334155" text-anchor="middle">who signed, and the rules they signed under</text>

  <!-- layer 2 -->
  <rect x="330" y="230" width="540" height="70" rx="12" fill="#d6ecf2" stroke="#0891b2" stroke-width="2"/>
  <text x="600" y="262" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0b1f3a" text-anchor="middle">Layer 2: a trusted time-stamp</text>
  <text x="600" y="286" font-family="system-ui, sans-serif" font-size="16" fill="#334155" text-anchor="middle">proof of exactly when it was signed</text>

  <!-- layer 3 -->
  <rect x="360" y="140" width="480" height="70" rx="12" fill="#c3e3eb" stroke="#0e7490" stroke-width="2"/>
  <text x="600" y="172" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#0b1f3a" text-anchor="middle">Layer 3: certificates and their status</text>
  <text x="600" y="196" font-family="system-ui, sans-serif" font-size="16" fill="#334155" text-anchor="middle">so it still checks out after the certificates expire</text>

  <!-- side labels -->
  <text x="120" y="360" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#64748b">basic</text>
  <text x="120" y="270" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#0891b2">stronger</text>
  <text x="120" y="180" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#0e7490">strongest</text>

  <text x="1000" y="180" font-family="system-ui, sans-serif" font-size="16" fill="#64748b" text-anchor="end">this is the level</text>
  <text x="1000" y="202" font-family="system-ui, sans-serif" font-size="16" fill="#64748b" text-anchor="end">Perfuse produces</text>

  <rect x="300" y="414" width="600" height="30" rx="12" fill="#ffffff" stroke="#0e7490" stroke-width="2"/>
  <text x="600" y="434" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#0e7490" text-anchor="middle">each layer sits on the one below it</text>
</svg>
