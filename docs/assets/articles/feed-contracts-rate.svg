<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="Why a contract expectation is a proportion rather than all-or-nothing. Out of ten thousand messages, a few odd ones are normal and should not raise an alarm. A rule set at ninety-nine percent ignores one missing field in ten thousand but fires when five hundred go missing.">
  <title>An expectation is a proportion, not all-or-nothing</title>
  <rect width="1200" height="540" rx="18" fill="#ffffff"/>
  <text x="60" y="56" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="26" font-weight="700" fill="#0b1f3a">Why the rule is a proportion</text>
  <text x="60" y="88" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" fill="#334155">A rule that fires on every odd message trains people to ignore it</text>

  <!-- Case A -->
  <rect x="60" y="120" width="520" height="330" rx="16" fill="#f5f8fc" stroke="#0e7490" stroke-width="2"/>
  <text x="320" y="156" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="19" font-weight="700" fill="#0e7490" text-anchor="middle">Normal day — stay quiet</text>
  <text x="320" y="186" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" fill="#334155" text-anchor="middle">10,000 messages, 1 missing the record number</text>
  <!-- bar -->
  <rect x="100" y="214" width="440" height="40" rx="8" fill="#0e7490"/>
  <rect x="536" y="214" width="4" height="40" rx="2" fill="#b91c1c"/>
  <text x="320" y="240" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">99.99% have it</text>
  <rect x="100" y="286" width="440" height="60" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="320" y="314" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" fill="#0b1f3a" text-anchor="middle">rule: &quot;present in at least 99%&quot;</text>
  <text x="320" y="336" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="700" fill="#0e7490" text-anchor="middle">99.99% is above 99% &#8594; no alarm</text>
  <text x="320" y="392" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#334155" text-anchor="middle">one test message or manual entry is</text>
  <text x="320" y="414" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#334155" text-anchor="middle">expected, and does not wake anyone</text>

  <!-- Case B -->
  <rect x="620" y="120" width="520" height="330" rx="16" fill="#f5f8fc" stroke="#b91c1c" stroke-width="2"/>
  <text x="880" y="156" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="19" font-weight="700" fill="#b91c1c" text-anchor="middle">Something broke — raise it</text>
  <text x="880" y="186" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" fill="#334155" text-anchor="middle">10,000 messages, 500 missing the record number</text>
  <!-- bar -->
  <rect x="660" y="214" width="418" height="40" rx="8" fill="#0e7490"/>
  <rect x="1078" y="214" width="22" height="40" rx="4" fill="#b91c1c"/>
  <text x="869" y="240" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">95% have it</text>
  <rect x="660" y="286" width="440" height="60" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="880" y="314" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" fill="#0b1f3a" text-anchor="middle">rule: &quot;present in at least 99%&quot;</text>
  <text x="880" y="336" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="700" fill="#b91c1c" text-anchor="middle">95% is below 99% &#8594; alarm</text>
  <text x="880" y="392" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#334155" text-anchor="middle">a real drop like this is exactly what</text>
  <text x="880" y="414" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#334155" text-anchor="middle">you want to hear about at once</text>

  <text x="60" y="500" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" fill="#334155">The same rule stays silent for harmless noise and speaks up for a genuine change. That is what makes it trustworthy.</text>
</svg>
