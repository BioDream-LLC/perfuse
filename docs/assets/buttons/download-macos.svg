<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 76" width="290" height="76" role="img"
     aria-label="Download Perfuse for macOS, Apple Silicon">
  <title>Download for macOS</title>
  <defs>
    <linearGradient id="bM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5568"/><stop offset="52%" stop-color="#2d3748"/><stop offset="100%" stop-color="#131820"/>
    </linearGradient>
    <linearGradient id="gM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.38"/><stop offset="45%" stop-color="#fff" stop-opacity="0.10"/>
      <stop offset="46%" stop-color="#fff" stop-opacity="0"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="42%" stop-color="#fff" stop-opacity="0.20"/>
      <stop offset="58%" stop-color="#fff" stop-opacity="0.20"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="dM" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2.4" stdDeviation="2.8" flood-color="#0b1220" flood-opacity="0.34"/>
    </filter>
    <clipPath id="cM"><rect x="3" y="3" width="284" height="66" rx="15"/></clipPath>
  </defs>

  <rect x="3" y="3" width="284" height="66" rx="15" fill="url(#bM)" filter="url(#dM)"/>
  <g clip-path="url(#cM)">
    <rect x="3" y="3" width="284" height="66" fill="url(#gM)"/>
    <rect x="-64" y="3" width="150" height="66" fill="url(#sM)" transform="skewX(-18)"/>
  </g>
  <path d="M18 4.2 H272" stroke="#fff" stroke-opacity="0.45" stroke-width="1.3" fill="none"/>
  <rect x="3" y="3" width="284" height="66" rx="15" fill="none" stroke="#131820" stroke-opacity="0.8" stroke-width="1"/>

  <g transform="translate(26, 26)" fill="#fff" fill-opacity="0.96"><path d="M19.3 10.6c0-3 2.4-4.4 2.5-4.5-1.4-2-3.5-2.3-4.2-2.3-1.9-.2-3.6 1.1-4.6 1.1-1 0-2.4-1-4-1C7 3.9 5 5.2 3.9 7.2c-2.3 4-.6 9.9 1.6 13.1 1.1 1.6 2.4 3.4 4.1 3.3 1.6-.1 2.2-1.1 4.2-1.1 2 0 2.5 1 4.2 1 1.7 0 2.9-1.6 4-3.2.8-1.2 1.2-2.4 1.4-2.9-.1 0-3.9-1.5-4.1-5.8ZM16.4 2.4c.9-1.1 1.5-2.6 1.3-4.1-1.3.1-2.9.9-3.9 2-.8.9-1.5 2.4-1.3 3.9 1.5.1 3-.7 3.9-1.8Z" transform="translate(-4,-11) scale(0.86)"/></g>

  <!-- 15px on every line, and the intrinsic width matches the width it is displayed at, so nothing is scaled down. -->
  <text x="76" y="31" font-size="15" font-weight="700" fill="#fff" fill-opacity="0.80" letter-spacing="0.08em"
        font-family="system-ui, -apple-system, Segoe UI, sans-serif">DOWNLOAD FOR</text>
  <text x="76" y="55" font-size="15" font-weight="700" fill="#fff"
        font-family="system-ui, -apple-system, Segoe UI, sans-serif">macOS <tspan fill-opacity="0.72" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Apple Silicon</tspan></text>
