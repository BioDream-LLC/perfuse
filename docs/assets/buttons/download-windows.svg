<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 248 76" width="248" height="76" role="img"
     aria-label="Download Perfuse for Windows, x64">
  <title>Download for Windows</title>
  <defs>
    <linearGradient id="bW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3da5f5"/><stop offset="52%" stop-color="#0d7fd6"/><stop offset="100%" stop-color="#075a9c"/>
    </linearGradient>
    <linearGradient id="gW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.38"/><stop offset="45%" stop-color="#fff" stop-opacity="0.10"/>
      <stop offset="46%" stop-color="#fff" stop-opacity="0"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sW" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="42%" stop-color="#fff" stop-opacity="0.20"/>
      <stop offset="58%" stop-color="#fff" stop-opacity="0.20"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="dW" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2.4" stdDeviation="2.8" flood-color="#0b1220" flood-opacity="0.34"/>
    </filter>
    <clipPath id="cW"><rect x="3" y="3" width="242" height="66" rx="15"/></clipPath>
  </defs>

  <rect x="3" y="3" width="242" height="66" rx="15" fill="url(#bW)" filter="url(#dW)"/>
  <g clip-path="url(#cW)">
    <rect x="3" y="3" width="242" height="66" fill="url(#gW)"/>
    <rect x="-64" y="3" width="150" height="66" fill="url(#sW)" transform="skewX(-18)"/>
  </g>
  <path d="M18 4.2 H230" stroke="#fff" stroke-opacity="0.45" stroke-width="1.3" fill="none"/>
  <rect x="3" y="3" width="242" height="66" rx="15" fill="none" stroke="#075a9c" stroke-opacity="0.8" stroke-width="1"/>

  <g transform="translate(26, 26)" fill="#fff" fill-opacity="0.96"><path d="M0 3.4 10.6 2v9.6H0V3.4Zm12 -1.7L26 0v11.4H12V1.7ZM0 13.1h10.6v9.6L0 21.2v-8.1Zm12 0H26V24l-14-1.9v-9Z" transform="translate(-1,-10) scale(0.88)"/></g>

  <!-- 15px on every line, and the intrinsic width matches the width it is displayed at, so nothing is scaled down. -->
  <text x="76" y="31" font-size="15" font-weight="700" fill="#fff" fill-opacity="0.80" letter-spacing="0.08em"
        font-family="system-ui, -apple-system, Segoe UI, sans-serif">DOWNLOAD FOR</text>
  <text x="76" y="55" font-size="15" font-weight="700" fill="#fff"
        font-family="system-ui, -apple-system, Segoe UI, sans-serif">Windows <tspan fill-opacity="0.72" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">x64</tspan></text>
</svg>
