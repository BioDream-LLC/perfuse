<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 248 76" width="248" height="76" role="img"
     aria-label="Download Perfuse for Linux, x86-64">
  <title>Download for Linux</title>
  <defs>
    <linearGradient id="bL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0784a"/><stop offset="52%" stop-color="#e2551f"/><stop offset="100%" stop-color="#a63a10"/>
    </linearGradient>
    <linearGradient id="gL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.38"/><stop offset="45%" stop-color="#fff" stop-opacity="0.10"/>
      <stop offset="46%" stop-color="#fff" stop-opacity="0"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="42%" stop-color="#fff" stop-opacity="0.20"/>
      <stop offset="58%" stop-color="#fff" stop-opacity="0.20"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="dL" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2.4" stdDeviation="2.8" flood-color="#0b1220" flood-opacity="0.34"/>
    </filter>
    <clipPath id="cL"><rect x="3" y="3" width="242" height="66" rx="15"/></clipPath>
  </defs>

  <rect x="3" y="3" width="242" height="66" rx="15" fill="url(#bL)" filter="url(#dL)"/>
  <g clip-path="url(#cL)">
    <rect x="3" y="3" width="242" height="66" fill="url(#gL)"/>
    <rect x="-64" y="3" width="150" height="66" fill="url(#sL)" transform="skewX(-18)"/>
  </g>
  <path d="M18 4.2 H230" stroke="#fff" stroke-opacity="0.45" stroke-width="1.3" fill="none"/>
  <rect x="3" y="3" width="242" height="66" rx="15" fill="none" stroke="#a63a10" stroke-opacity="0.8" stroke-width="1"/>

  <g transform="translate(26, 26)" fill="#fff" fill-opacity="0.96"><path d="M14 0c-3.2 0-5.1 2.3-5 5.4.1 2-.5 3.1-1.7 4.6C5.6 12 4.4 13.4 4.4 15.2c0 2.3 2 3.1 4.4 3.4 1.6.2 3.1.9 4.4.9s2.8-.7 4.4-.9c2.4-.3 4.4-1.1 4.4-3.4 0-1.8-1.2-3.2-2.9-5.2-1.2-1.5-1.8-2.6-1.7-4.6C17.5 2.3 17.2 0 14 0Zm-2.4 4.2c.6 0 1 .6 1 1.3s-.4 1.3-1 1.3-1-.6-1-1.3.4-1.3 1-1.3Zm4.8 0c.6 0 1 .6 1 1.3s-.4 1.3-1 1.3-1-.6-1-1.3.4-1.3 1-1.3Zm-2.4 3.1 2 1.5c.3.3.3.7 0 .9l-1.6 1c-.3.2-.6.2-.9 0l-1.6-1c-.3-.2-.3-.6 0-.9l2-1.5Z" transform="translate(-2,-10) scale(0.88)"/></g>

  <!-- 15px on every line, and the intrinsic width matches the width it is displayed at, so nothing is scaled down. -->
  <text x="76" y="31" font-size="15" font-weight="700" fill="#fff" fill-opacity="0.80" letter-spacing="0.08em"
        font-family="system-ui, -apple-system, Segoe UI, sans-serif">DOWNLOAD FOR</text>
  <text x="76" y="55" font-size="15" font-weight="700" fill="#fff"
        font-family="system-ui, -apple-system, Segoe UI, sans-serif">Linux <tspan fill-opacity="0.72" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">x86-64</tspan></text>
</svg>
