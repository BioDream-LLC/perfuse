# Da Vinci CRD rules: what Springfield Health Plan tells a clinician about an order while it is still a draft.
# Start the server with -crd-rules examples/crd/rules.yaml, and load the questionnaire into the FHIR endpoint.
payer: Springfield Health Plan
url: https://www.springfield-health-plan.example
rules:
  - description: Home oxygen equipment
    codes: [E0424, E0431, E1390]
    system: https://www.cms.gov/Medicare/Coding/HCPCSReleaseCodeSets
    covered: covered
    pa: auth-needed
    documentation: [clinical]
    questionnaire: https://www.springfield-health-plan.example/fhir/Questionnaire/home-oxygen
    reason: Prior authorization is required for home oxygen. Qualifying oxygen saturation within the last 30 days must be documented.
    links:
      - label: Home oxygen coverage policy
        url: https://www.springfield-health-plan.example/policies/home-oxygen
  - description: Office visit
    codes: ["99213", "99214"]
    covered: covered
    pa: no-auth
  - description: Cosmetic procedure
    codes: ["15830"]
    covered: not-covered
    reason: Cosmetic surgery is excluded from the plan.
