name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      # gofmt must already be clean. Formatting in CI hides the diff from the
      # person who caused it.
      - name: gofmt
        run: |
          if [ -n "$(gofmt -l cmd internal)" ]; then
            echo "these files need gofmt:"
            gofmt -l cmd internal
            gofmt -d cmd internal
            exit 1
          fi

      # vet and the race detector both run inside check-go, through the Makefile, so
      # the test timeout is defined in exactly one place (GOTESTTIMEOUT).
      #
      # The race detector is not optional: the MLLP server is concurrent, and a data
      # race in message handling is a patient-safety defect.
      - name: test and vet
        run: make check-go

      # Known vulnerabilities in what Perfuse calls, the standard library included. With the toolchain line in go.mod
      # this checks the Go releases are built with, whatever setup-go installed.
      - name: govulncheck
        run: make vulncheck

      - name: build
        run: go build ./...

  # The whole suite again on PostgreSQL, the store a cluster shares, and the cluster's own tests: failover, a cut-off
  # leader stopping first, and two servers killed in turn with SIGKILL while a sender streams messages, every
  # acknowledged message checked at the receiver.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: perfuse
          POSTGRES_PASSWORD: perfuse
          POSTGRES_DB: perfuse
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U perfuse" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      PERFUSE_TEST_POSTGRES: postgres://perfuse:perfuse@127.0.0.1:5432/perfuse?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: raise max_connections
        run: |
          docker exec ${{ job.services.postgres.id }} sh -c "echo 'max_connections = 1000' >> /var/lib/postgresql/data/postgresql.conf"
          docker restart ${{ job.services.postgres.id }}
          for i in $(seq 1 30); do docker exec ${{ job.services.postgres.id }} pg_isready -U perfuse && break; sleep 1; done

      - name: test on PostgreSQL
        run: go test -race -timeout 20m ./...

  cross:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      # Builds and vets every release target. This proves it compiles there, not
      # that it runs there; the windows job runs the tests and the server on Windows.
      - name: build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          go build ./...
          go vet ./...

  # The tests and the server, run on Windows: the cross job above only proves it compiles there.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: test
        run: go test -timeout 900s ./...

      # Starts the real server on a fresh database and checks it answers, as an administrator would on first install.
      - name: serve
        shell: pwsh
        run: |
          go build -o perfuse.exe ./cmd/perfuse
          ./perfuse.exe version
          $p = Start-Process -FilePath ./perfuse.exe -ArgumentList 'serve','-db','smoke.db','-addr','127.0.0.1:8480' -PassThru -RedirectStandardError serve.log
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 2
            foreach ($u in 'https://127.0.0.1:8480/livez','http://127.0.0.1:8480/livez') {
              try { $r = Invoke-WebRequest -Uri $u -SkipCertificateCheck -TimeoutSec 5; if ($r.StatusCode -eq 200) { $ok = $true; "answered $u" } } catch {}
            }
            if ($ok) { break }
          }
          Stop-Process -Id $p.Id -Force
          Get-Content serve.log -Tail 20
          if (-not $ok) { throw 'perfuse serve did not answer /livez' }

      # Installs the service the way the manual says - perfuse init, then the generated install-service.ps1 as an
      # administrator - and checks it runs as LocalService, answers, wrote the one-time password to its log, and that
      # the data folder no longer lets ordinary users in.
      - name: service
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'C:\Program Files\Perfuse' | Out-Null
          Copy-Item ./perfuse.exe 'C:\Program Files\Perfuse\perfuse.exe'
          ./perfuse.exe init -dir C:\perfuse-ci -service windows
          & C:\perfuse-ci\install-service.ps1
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 2
            try { if ((Invoke-WebRequest -Uri http://127.0.0.1:8080/livez -TimeoutSec 5).StatusCode -eq 200) { $ok = $true; break } } catch {}
          }
          Get-CimInstance Win32_Service -Filter "Name='Perfuse'" | Format-List Name, State, StartMode, StartName
          if (-not $ok) { Get-Content C:\perfuse-ci\logs\perfuse.log -Tail 30 -ErrorAction SilentlyContinue; throw 'the service did not answer /livez' }
          if ((Get-CimInstance Win32_Service -Filter "Name='Perfuse'").StartName -ne 'NT AUTHORITY\LocalService') { throw 'the service is not running as LocalService' }
          if (-not (Select-String -Path C:\perfuse-ci\logs\perfuse.log -Pattern 'password:' -Quiet)) { throw 'the one-time administrator password is not in the log' }
          $users = (Get-Acl C:\perfuse-ci).Access | Where-Object { $_.IdentityReference -match 'Users|Everyone|Authenticated' }
          if ($users) { $users | Format-Table; throw 'ordinary users can still reach the data folder' }
          Stop-Service Perfuse
          if ((Get-Service Perfuse).Status -ne 'Stopped') { throw 'the service did not stop' }
          ./perfuse.exe service remove
          "service installed, answered, stopped and removed"

  # Windows on Arm: the tests and the server, on real arm64 hardware.
  windows-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: test
        run: go test -timeout 1200s ./...

      - name: serve
        shell: pwsh
        run: |
          go build -o perfuse.exe ./cmd/perfuse
          ./perfuse.exe version
          $p = Start-Process -FilePath ./perfuse.exe -ArgumentList 'serve','-db','smoke.db','-addr','127.0.0.1:8480' -PassThru
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 2
            try { if ((Invoke-WebRequest -Uri http://127.0.0.1:8480/livez -TimeoutSec 5).StatusCode -eq 200) { $ok = $true; break } } catch {}
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw 'perfuse serve did not answer /livez' }
          "answered on $env:PROCESSOR_ARCHITECTURE"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: install
        working-directory: web
        run: pnpm install --frozen-lockfile

      # Type-check and unit-test the front end.
      #
      # The bundle freshness check (make check-web-current) is deliberately not run
      # here. The bundle includes perfuse.wasm, which is compiled by Go, and its bytes
      # depend on the exact Go release - so a runner on a different patch release
      # reports a stale bundle that is not stale. It runs locally, inside make check,
      # on the machine whose toolchain built the committed bundle.
      - name: type-check and test
        run: make check-web
