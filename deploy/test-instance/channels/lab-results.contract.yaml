# What a lab result from the demonstration hospital looks like (invented traffic). Generated by
# `perfuse contract promote` from 200 messages of `perfuse generate -kind oru`, then cut down to what a
# results archive actually depends on. The generator sends a legal but awkward message about one time in
# twelve, as real feeds do, so this contract is breached now and then: that is the point of the demonstration.

expectations:
    - path: MSH-9
      rule: populated
      min_rate: 0.99
      why: observed in 200 messages, populated in 100.0% of them
    - path: MSH-9
      rule: one of
      min_rate: 0.99
      values:
        - ORU
      why: 'observed in 200 messages, and only this value appeared: ORU'
    - path: MSH-11
      rule: populated
      min_rate: 0.99
      why: observed in 200 messages, populated in 100.0% of them
    - path: MSH-11
      rule: one of
      min_rate: 0.99
      values:
        - P
      why: 'observed in 200 messages, and only this value appeared: P'
    - path: MSH-12
      rule: populated
      min_rate: 0.99
      why: observed in 200 messages, populated in 100.0% of them
    - path: PID-3
      rule: populated
      min_rate: 0.99
      why: observed in 200 messages, populated in 100.0% of them
    - path: PID-3
      rule: at most
      limit: 4
      why: observed in 200 messages, repeating at most 2 times; the limit has headroom because the observed maximum is a sample
    - path: PID-7
      rule: populated
      min_rate: 0.99
      why: observed in 200 messages, populated in 100.0% of them
    - path: PID-8
      rule: one of
      min_rate: 0.99
      values:
        - F
        - M
        - U
      why: 'observed in 200 messages, and only these values appeared: F, M, U'
    - path: OBR-4
      rule: populated
      min_rate: 0.99
      why: observed in 200 messages, populated in 100.0% of them
    - path: OBX-2
      rule: populated
      min_rate: 0.99
      why: observed in 200 messages, populated in 100.0% of them
    - path: OBX-2
      rule: one of
      min_rate: 0.99
      values:
        - NM
      why: 'observed in 200 messages, and only this value appeared: NM'
    - path: OBX-3
      rule: populated
      min_rate: 0.99
      why: observed in 200 messages, populated in 100.0% of them
    - path: OBX-5
      rule: populated
      min_rate: 0.99
      why: observed in 200 messages, populated in 100.0% of them
    - path: OBX-11
      rule: populated
      min_rate: 0.99
      why: observed in 200 messages, populated in 100.0% of them
    - path: OBX-11
      rule: one of
      min_rate: 0.99
      values:
        - F
      why: 'observed in 200 messages, and only this value appeared: F'
