name: adt-to-registry
description: >
  Admissions, discharges and transfers. Identifier merges (A28) are declined, the hospital's
  record number is labelled with its assigning authority, and the rest goes to the patient
  registry over MLLP with TLS, into the patient index, and to an archive kept for a day.

source:
  type: mllp
  listen: "127.0.0.1:6661"
  ack:
    when: on_delivery

filter: MSH-9.1 == "ADT" && MSH-9.2 != "A28"

transformations:
  - description: Say whose record number this is (the first identifier only, so a national number keeps its own)
    set:
      path: PID-3(1).4
      value: RIVERSIDE
  - description: The registry wants the receiving application named
    set:
      path: MSH-5
      value: REGISTRY

destinations:
  - name: registry
    type: mllp
    address: 127.0.0.1:6671
    timeout: 10s
    # The demonstration's own certificate authority (setup.sh makes it), so the Certificates screen has an endpoint to show.
    tls:
      enabled: true
      ca_file: /opt/perfuse/data/demo-tls/ca.pem
      server_name: registry.riverside.example
    retry:
      attempts: 3
      backoff: 1s
      max_backoff: 10s
  - name: patient-index
    type: mpi
    mpi:
      authorities: { RIVERSIDE: "urn:oid:2.16.840.1.113883.3.9999.1" }
  - name: archive
    type: file
    dir: /opt/perfuse/data/demo-archive/adt
    file_name: ${date}-${message_type}.hl7
    append: true
    retain_hours: 24
