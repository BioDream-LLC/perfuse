name: lab-results
description: >
  Laboratory results. The ordering system's code for the lab is replaced with the one the
  results archive uses, and each day's results are kept in one file for a day.

source:
  type: mllp
  listen: "127.0.0.1:6662"
  ack:
    when: on_delivery

filter: MSH-9.1 == "ORU"

# The hospital's own codes, in a shared table that records who decided each mapping and why.
tables:
  - riverside.codeset.yaml

# What a lab result from this sender looks like, learned from its traffic: the day the sender changes, it says so.
contract:
  file: lab-results.contract.yaml

# A rewrite on trial beside the live channel, compared on every message and delivering nothing.
shadow:
  channel: lab-results-v2.yaml
  ignore: [MSH-7, MSH-10]

transformations:
  - description: The results archive's name for the sending lab
    set:
      path: MSH-4
      value: RIVERSIDE-LAB
  - description: The results archive's codes for administrative sex
    map:
      path: PID-8
      use: sex-to-results-archive

destinations:
  - name: results-archive
    type: file
    dir: /opt/perfuse/data/demo-archive/lab
    file_name: ${date}-ORU.hl7
    append: true
    retain_hours: 24
