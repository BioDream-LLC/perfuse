# The public test instance's payer: the CRD, DTR and PAS conformance runs' rules in one file. Their codes do not overlap, so
# each kit finds what its own run found. Test data only; no real plan, member or person.
payer: Perfuse Test Plan
url: https://test.perfuse.health
members: fhir
rules:
  # From conformance/inferno/crd: home oxygen, physical therapy, office visits, cosmetic surgery (HCPCS and CPT).
  - description: Home oxygen equipment
    codes: [E0424, E0431, E1390]
    system: http://www.cms.gov/Medicare/Coding/HCPCSReleaseCodeSets
    covered: covered
    pa: auth-needed
    documentation: [clinical]
    questionnaire: https://www.springfield-health-plan.example/fhir/Questionnaire/home-oxygen
    reason: Prior authorization is required for home oxygen. Qualifying oxygen saturation within the last 30 days must be documented.
    links:
      - label: Home oxygen coverage policy
        url: https://www.springfield-health-plan.example/policies/home-oxygen
    # Billed as a monthly rental, approved for 90 days at a time, and dependent on the oximetry that qualifies it: if that
    # order changes, the EHR should ask again.
    billing_codes:
      - {system: "http://www.cms.gov/Medicare/Coding/HCPCSReleaseCodeSets", code: E0424, display: "Stationary compressed gas 02"}
    details:
      - {code: allowed-period, value: "Rental for up to 36 months", qualification: "Recertification is required after the first 12 months"}
    depends_on: ["94760", "94761"]
    contact: {name: Springfield Health Plan utilization management, phone: "+1-217-555-0199", url: "https://www.springfield-health-plan.example/contact/um"}
    expiry_days: 90
  - description: Physical therapy evaluation
    codes: ["97161", "97162", "97163"]
    covered: covered
    pa: no-auth
    documentation: [clinical]
    doc_purpose: [retain-doc]
    reason: No prior authorization is needed. Keep the evaluation and plan of care on file; they are requested on audit.
    details:
      - {code: in-network-copay, value: "$30 per visit"}
  - description: Office visit
    codes: ["99213", "99214"]
    covered: covered
    pa: no-auth
  - description: Cosmetic procedure
    codes: ["15830"]
    covered: not-covered
    reason: Cosmetic surgery is excluded from the plan.
  # From conformance/inferno/dtr: Inferno's dinner-order questionnaire.
  - description: Dinner order (Inferno DTR fixture)
    codes: [DINNER]
    system: urn:inferno:dtr-test-kit:codes
    covered: covered
    pa: auth-needed
    documentation: [clinical]
    questionnaire: urn:inferno:dtr-test-kit:dinner-order-static
    reason: The plan needs the dinner order documented before it is served.
  # From conformance/inferno/pas: X12 service types.
  - description: Consultation
    codes: ["3"]
    system: https://codesystem.x12.org/005010/1365
    covered: covered
    pa: auth-needed
    pa_decision: approve
    reason: Consultations are approved when requested by an in-network provider.
  - description: Dialysis
    codes: ["76"]
    system: https://codesystem.x12.org/005010/1365
    covered: not-covered
    reason: Dialysis is not a benefit of this test plan.
  - description: Surgery
    codes: ["2"]
    system: https://codesystem.x12.org/005010/1365
    covered: covered
    pa: auth-needed
    documentation: [clinical]
    questionnaire: urn:inferno:dtr-test-kit:dinner-order-static
    pa_attachments: ["18776-5"]
    pa_attachment_modifiers: ["18804-5"]
    reason: Surgery is reviewed by a clinician with the plan of care.
  - description: Physical therapy
    codes: ["PT"]
    system: https://codesystem.x12.org/005010/1365
    covered: covered
    pa: auth-needed
    pa_decision: approve
    details:
      - code: allowed-quantity
        value: "6"
    reason: Up to six physical therapy visits are approved per request.
  - description: MRI
    codes: ["62"]
    system: https://codesystem.x12.org/005010/1365
    covered: covered
    pa: auth-needed
    pa_decision: approve
    pa_alternative: {system: "https://codesystem.x12.org/005010/1365", code: "4", display: "Diagnostic X-Ray"}
    reason: An X-ray is approved before an MRI.
